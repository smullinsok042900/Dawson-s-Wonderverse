<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#39206d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Dawson's Discovery World</title>
<style>:root{--ink:#3a2864;--pink:#ff65b5;--violet:#8754eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#28184f;color:#fff;font-family:ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,-apple-system,sans-serif;overscroll-behavior:none;touch-action:none}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 62%,rgba(48,19,100,.22))}
svg{display:block}

/* ---------- top bar ---------- */
#top{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:10}
#brand{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,rgba(80,38,155,.9),rgba(115,68,194,.86));border:2px solid rgba(255,255,255,.65);padding:6px 12px 6px 8px;border-radius:17px;box-shadow:0 6px 0 rgba(54,19,108,.18),0 10px 24px #44217750;line-height:1.05}
.brandStar{width:26px;height:26px;fill:#ffd84a;filter:drop-shadow(0 2px 0 #c76aa8)}
#brand small{display:block;color:#ffe19c;font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
#brand b{font-size:clamp(12px,2vw,17px);white-space:nowrap;text-shadow:0 2px #5c389a}
body.playing #brand small{display:none}
#upperRight{display:flex;gap:7px;align-items:center;pointer-events:auto}
.pill{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.94);border:2px solid #fff;border-bottom:4px solid #e1d2f6;border-radius:16px;color:#55408b;box-shadow:0 5px 14px #3b217744;font-weight:900;font-size:17px;padding:5px 11px;min-height:48px;min-width:48px;justify-content:center}
.pill svg{width:24px;height:24px;fill:#ffc531;stroke:#e98c1f;stroke-width:1}
.pill:active{transform:translateY(2px);border-bottom-width:2px}
#soundBtn svg{width:26px;height:26px}
#soundBtn .spk{fill:#8a5ad8;stroke:none}#soundBtn .wave{stroke:#8a5ad8}#soundBtn .cross{stroke:#ff5f9e;display:none}
#soundBtn.muted .wave{display:none}#soundBtn.muted .cross{display:block}
#chooser{display:flex;gap:5px;background:rgba(255,255,255,.55);border-radius:18px;padding:4px;border:2px solid #fff;box-shadow:0 5px 13px #33226a35}
.creatureChoice{width:52px;height:52px;padding:0;border-radius:14px;background:#fff6ee;border:3px solid transparent;display:grid;place-items:center;transition:transform .15s}
.creatureChoice canvas{width:46px;height:46px}
.creatureChoice.chosen{border-color:#ffbf33;background:#fff4b8;transform:scale(1.08);box-shadow:0 0 0 2px #fff}

/* ---------- toast ---------- */
#toast{z-index:11;position:fixed;top:calc(max(8px,env(safe-area-inset-top)) + 62px);left:50%;transform:translateX(-50%) translateY(-14px);max-width:min(78vw,480px);padding:9px 18px;border:3px solid #fff;border-radius:18px;background:linear-gradient(130deg,#ffec9b,#fff6d5);color:#673b8b;font-size:15px;font-weight:900;text-align:center;box-shadow:0 7px 0 #8a55bc33,0 12px 22px #57358f55;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
#toast.shown{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- paint tools (appear only near the paint wall) ---------- */
#paintTools{position:fixed;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 6px);left:50%;transform:translateX(-50%) translateY(10px);display:flex;gap:7px;align-items:center;padding:6px 10px;border:2px solid rgba(255,255,255,.9);border-radius:30px;background:rgba(83,52,144,.78);box-shadow:0 5px 25px #3b238c44;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s;z-index:9}
#paintTools.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.swatch{width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 5px #31204460;transform:scale(.92);padding:0}
.swatch.selected{outline:4px solid #ffdc6b;outline-offset:1px;transform:scale(1.1)}
.swatch.mix{background-image:radial-gradient(circle at 35% 30%,rgba(255,255,255,.7) 0 18%,transparent 19%)!important;position:relative}
.toolBtn{width:42px;height:42px;border-radius:50%;border:3px solid #fff;background:#8a5ad8;display:grid;place-items:center;padding:0}
.toolBtn svg{width:24px;height:24px;stroke:#fff}

/* ---------- movement & jump ---------- */
#bottom{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));padding:0 max(14px,env(safe-area-inset-left)) 0 max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right));display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none;z-index:10}
.controls{display:flex;gap:14px;pointer-events:auto;align-items:flex-end}
.ctrl{touch-action:none;border:3px solid rgba(255,255,255,.95);border-bottom:7px solid rgba(255,255,255,.6);box-shadow:0 7px 0 #39207044,0 13px 18px #2c19545c;border-radius:26px;width:76px;height:72px;padding:0;background:linear-gradient(155deg,#9a6cfb,#663ac8);display:grid;place-items:center}
.ctrl svg{width:38px;height:38px;fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 0 #4b2896)}
.ctrl.right{background:linear-gradient(155deg,#8a72fb,#4b49ce)}
.ctrl.jump{width:98px;height:84px;border-radius:30px;background:linear-gradient(150deg,#ffa37a,#ff4f99)}
.ctrl.jump svg{width:44px;height:44px;fill:#fff;stroke:#fff;stroke-width:1.5;filter:drop-shadow(0 2px 0 #c03a7a)}
.ctrl.pressed{transform:translateY(4px) scale(.95);border-bottom-width:3px;filter:brightness(1.15)}

/* ---------- title card ---------- */
#overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:linear-gradient(145deg,rgba(48,24,94,.78),rgba(46,37,108,.82));overflow:auto;touch-action:pan-y}
#intro{position:relative;max-width:640px;width:min(96vw,640px);text-align:center;background:linear-gradient(160deg,#fffdf6,#f2e8ff);border:6px solid #fff;border-radius:36px;padding:20px 22px 18px;box-shadow:0 12px 0 #47216c,0 30px 65px #29104c99;color:#4b357a}
#intro .eyebrow{font-size:11px;font-weight:900;letter-spacing:3px;color:#a35cb9;text-transform:uppercase}
#intro h1{line-height:1.01;margin:6px 0 4px;font-weight:900;font-size:clamp(28px,6vw,50px);color:#a551e7;text-shadow:2px 3px #ffe084}
#intro h1 span{color:#fa65a4}
.previewCrew{display:flex;justify-content:center;gap:12px;margin:6px 0 12px}
.introPick{background:#fff;border:4px solid #eadcff;border-radius:24px;padding:4px 4px 2px;display:flex;flex-direction:column;align-items:center;transition:transform .15s;box-shadow:0 5px 0 #d9c6f5}
.introPick canvas{width:96px;height:96px}
.introPick b{font-size:15px;color:#7b4fc4;margin-top:-2px}
.introPick.chosen{border-color:#ffbf33;background:#fff7cf;transform:translateY(-4px) scale(1.04)}
#playBtn{width:min(100%,360px);border:3px solid #fff;border-bottom:7px solid #d7408a;border-radius:22px;background:linear-gradient(180deg,#ff94ca,#ff52a7);color:#fff;padding:13px 22px;font-size:24px;font-weight:900;text-shadow:0 2px #bc3b93;box-shadow:0 7px 24px #e451a46e}
#playBtn:active{transform:translateY(3px);border-bottom-width:4px}
#intro .micro{font-size:12px;color:#8f7eac;margin:10px 0 0;font-weight:800}

#rotateTip{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:14px 18px;background:#fff9d8f0;color:#6848a5;border:3px solid #fff;border-radius:20px;font-size:16px;font-weight:900;display:none;z-index:12;pointer-events:none;text-align:center;box-shadow:0 10px 30px #2a125566}
@media (orientation:portrait) and (max-width:700px){
  body.playing #rotateTip{display:block;animation:fadeTip 5s forwards}
  #brand{display:none}
  #upperRight{gap:5px;flex-wrap:wrap;justify-content:flex-end}
  .creatureChoice{width:46px;height:46px}.creatureChoice canvas{width:40px;height:40px}
  .ctrl{width:66px;height:64px}.ctrl.jump{width:84px;height:74px}
  #paintTools{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 92px);flex-wrap:wrap;justify-content:center;max-width:94vw}
  .introPick canvas{width:76px;height:76px}
}
@keyframes fadeTip{0%,80%{opacity:1}100%{opacity:0}}
@media (max-height:430px){
  #brand{padding:4px 9px 4px 6px}#brand small{display:none}.brandStar{width:20px;height:20px}
  .pill{min-height:44px;min-width:44px;padding:3px 9px}
  .creatureChoice{width:46px;height:46px}.creatureChoice canvas{width:40px;height:40px}
  #toast{top:calc(max(6px,env(safe-area-inset-top)) + 54px);font-size:13px;padding:6px 14px}
  .swatch,.toolBtn{width:38px;height:38px}
  .ctrl{width:70px;height:64px}.ctrl.jump{width:90px;height:74px}
  #intro{padding:10px 16px 10px;border-radius:26px}#intro h1{font-size:28px;margin:2px 0}
  .previewCrew{margin:2px 0 6px}.introPick canvas{width:72px;height:72px}
  #playBtn{font-size:19px;padding:8px}#intro .micro{font-size:10px;margin-top:5px}
}
</style>
</head>
<body>
<canvas id="game" aria-label="Dawson's Discovery World — one giant play world"></canvas>
<div id="vignette"></div>

<div id="top">
  <div id="brand"><svg class="brandStar" viewBox="0 0 24 24"><path d="M12 1.8l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 16.7l-6.1 3.5 1.5-6.8L2.2 8.8l6.9-.7z"/></svg><div><small>Milestone 1 · build 2</small><b>Dawson's Discovery World</b></div></div>
  <div id="upperRight">
    <button class="pill" id="discoveries" aria-label="Discoveries"><svg viewBox="0 0 24 24"><path d="M12 1.8l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 16.7l-6.1 3.5 1.5-6.8L2.2 8.8l6.9-.7z"/></svg><span id="discCount">0</span></button>
    <div id="chooser" role="group" aria-label="Choose your creature">
      <button class="creatureChoice" data-creature="pip" aria-label="Pip"><canvas></canvas></button>
      <button class="creatureChoice" data-creature="zuzu" aria-label="Zuzu"><canvas></canvas></button>
      <button class="creatureChoice" data-creature="jelly" aria-label="Jelly"><canvas></canvas></button>
    </div>
    <button class="pill icon" id="soundBtn" aria-label="Sound on"><svg viewBox="0 0 24 24"><path class="spk" d="M3 9h4l5-4v14l-5-4H3z"/><path class="wave" d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" fill="none" stroke-width="2.2" stroke-linecap="round"/><path class="cross" d="M15 9l6 6M21 9l-6 6" fill="none" stroke-width="2.4" stroke-linecap="round"/></svg></button>
  </div>
</div>
<div id="rotateTip">↻ Turn your phone sideways for the biggest view!</div>
<div id="toast" role="status" aria-live="polite"></div>

<div id="paintTools" aria-label="Paint colors">
  <button class="swatch selected" data-color="#fb5aaf" style="background:#fb5aaf" aria-label="Pink paint"></button>
  <button class="swatch" data-color="#ffc544" style="background:#ffc544" aria-label="Yellow paint"></button>
  <button class="swatch" data-color="#49d6e6" style="background:#49d6e6" aria-label="Cyan paint"></button>
  <button class="swatch" data-color="#9d73ff" style="background:#9d73ff" aria-label="Purple paint"></button>
  <button class="swatch" data-color="#68d87c" style="background:#68d87c" aria-label="Green paint"></button>
  <button class="swatch mix" id="mixSwatch" data-color="#b06bff" aria-label="Your mixed paint"></button>
  <button class="toolBtn" id="undoBtn" aria-label="Undo last stroke"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M5 12h9a5 5 0 010 10h-2" fill="none" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</div>

<div id="bottom">
  <div class="controls">
    <button class="ctrl" id="leftBtn" aria-label="Move left"><svg viewBox="0 0 24 24"><path d="M15.5 4.5L7.5 12l8 7.5"/></svg></button>
    <button class="ctrl right" id="rightBtn" aria-label="Move right"><svg viewBox="0 0 24 24"><path d="M8.5 4.5l8 7.5-8 7.5"/></svg></button>
  </div>
  <div class="controls">
    <button class="ctrl jump" id="jumpBtn" aria-label="Jump"><svg viewBox="0 0 24 24"><path d="M12 3l7 8h-4.5v9h-5v-9H5z"/></svg></button>
  </div>
</div>

<div id="overlay">
  <section id="intro">
    <div class="eyebrow">One giant world of surprises</div>
    <h1>Dawson's<br><span>Discovery World!</span></h1>
    <div class="previewCrew">
      <button class="introPick" data-creature="pip" aria-label="Play as Pip"><canvas></canvas><b>Pip</b></button>
      <button class="introPick" data-creature="zuzu" aria-label="Play as Zuzu"><canvas></canvas><b>Zuzu</b></button>
      <button class="introPick" data-creature="jelly" aria-label="Play as Jelly"><canvas></canvas><b>Jelly</b></button>
    </div>
    <button id="playBtn">▶ LET'S PLAY!</button>
    <p class="micro">No levels • No timer • No losing • Saves on this device</p>
  </section>
</div>
<script>
(() => {
'use strict';
// ---- 00_core.js ----
// ===================================================================
// 00_core.js — constants, math, drawing helpers, color, audio, particles
// ===================================================================
const canvas = document.getElementById('game');
let ctx = canvas.getContext('2d', { alpha: false });

const VH = 540;          // world units visible vertically (camera height)
const GROUND = 450;      // floor line in world units
const WORLD_W = 5800;    // ONE continuous world, left to right
const GRAV = 1450;
const TAU = Math.PI * 2;

const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const smooth = t => t * t * (3 - 2 * t);

let vw = 960, scale = 1, camera = 0, started = false, paused = false;
let gameTime = 0, lastFrame = 0, frameCount = 0;
const keys = { left: false, right: false };

// Damped spring (semi-implicit Euler). Used for all secondary motion.
function spring(s, target, k, damp, dt) {
  s.v += (target - s.x) * k * dt;
  s.v *= Math.exp(-damp * dt);
  s.x += s.v * dt;
}

// Temporarily draw into another context (creature portraits share the rig code)
function withCtx(c, fn) { const old = ctx; ctx = c; try { fn(); } finally { ctx = old; } }

// ---------- drawing primitives ----------
function rounded(x, y, w, h, r, fill, stroke, line = 3) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = line; ctx.stroke(); }
}
function ellipse(x, y, rx, ry, fill, stroke, line = 3, rot = 0) {
  ctx.beginPath(); ctx.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot, 0, TAU);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = line; ctx.stroke(); }
}
function grad(x, y, w, h, stops) {
  const g = ctx.createLinearGradient(x, y, x + w, y + h);
  stops.forEach(([p, c]) => g.addColorStop(p, c)); return g;
}
function rg(x, y, r, colors) {
  const g = ctx.createRadialGradient(x - r * .28, y - r * .36, r * .09, x, y, r);
  colors.forEach(([p, c]) => g.addColorStop(p, c)); return g;
}
function text(str, x, y, size, color = '#fff', stroke = '#6e4c9c', weight = 900, align = 'center') {
  ctx.font = `${weight} ${size}px ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = Math.max(3, size * .24); ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function starPath(x, y, r, points = 5, angle = -Math.PI / 2, inner = .47) {
  for (let i = 0; i < points * 2; i++) {
    const a = angle + i * Math.PI / points, rr = r * (i % 2 ? inner : 1);
    i ? ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath();
}
function star(x, y, r, fill, points = 5, angle = -Math.PI / 2) { ctx.beginPath(); starPath(x, y, r, points, angle); ctx.fillStyle = fill; ctx.fill(); }
function sparkle(x, y, r = 6, col = '#fff9bd') { star(x, y, r, col, 4, Math.PI / 4); }
function heartPath(x, y, s) {
  ctx.moveTo(x, y + s * .35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * .35, x - s * .45, y - s * 1.05, x, y - s * .45);
  ctx.bezierCurveTo(x + s * .45, y - s * 1.05, x + s * 1.1, y - s * .35, x, y + s * .35);
  ctx.closePath();
}
// Tapered capsule from (x1,y1) radius w1 to (x2,y2) radius w2 — used for limbs so they
// are one solid connected shape rather than floating ovals.
function limbPath(x1, y1, x2, y2, w1, w2) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  ctx.moveTo(x1 + Math.cos(a + Math.PI / 2) * w1, y1 + Math.sin(a + Math.PI / 2) * w1);
  ctx.arc(x1, y1, w1, a + Math.PI / 2, a - Math.PI / 2);
  ctx.arc(x2, y2, w2, a - Math.PI / 2, a + Math.PI / 2);
  ctx.closePath();
}
// Fluffy (scalloped) ellipse outline, for Pip's fur.
function fluffPath(x, y, rx, ry, bumps = 14, amt = .055, phase = 0) {
  const n = 64;
  for (let i = 0; i <= n; i++) {
    const a = i / n * TAU, k = 1 + amt * Math.abs(Math.sin(a * bumps / 2 + phase));
    const px = x + Math.cos(a) * rx * k, py = y + Math.sin(a) * ry * k;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}
// Two-pass "inked" drawing: all outlines first, then all fills. Parts drawn in one call
// merge into a single seamless silhouette — the core trick that keeps limbs attached.
function inked(parts, outline, lw = 6) {
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = outline; ctx.lineWidth = lw;
  for (const p of parts) { ctx.beginPath(); p.path(); ctx.stroke(); }
  for (const p of parts) { ctx.beginPath(); p.path(); ctx.fillStyle = p.fill; ctx.fill(); }
}

// ---------- color ----------
function hexToRgb(h) {
  h = String(h).replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h.slice(0, 6), 16) || 0; return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
const rgbToHex = ([r, g, b]) => '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
const mixHex = (a, b, t) => { const A = hexToRgb(a), B = hexToRgb(b); return rgbToHex(A.map((v, i) => lerp(v, B[i], t))); };
const shade = (h, amt) => mixHex(h, amt > 0 ? '#ffffff' : '#2a1550', Math.abs(amt));
const withAlpha = (h, a) => { const [r, g, b] = hexToRgb(h); return `rgba(${r},${g},${b},${a})`; };
const isHex = s => typeof s === 'string' && /^#[0-9a-f]{6}$/i.test(s);

// Real pigment-style mixing (RYB cube → RGB, after Gossett & Chen) so that
// yellow + blue really makes green, red + blue makes purple, etc.
const RYB_CUBE = [[255, 255, 255], [255, 40, 110], [255, 216, 60], [255, 128, 40], [52, 150, 255], [148, 70, 225], [60, 196, 110], [90, 70, 80]];
function rybToHex(r, y, b) {
  const c = RYB_CUBE, out = [0, 0, 0];
  for (let i = 0; i < 3; i++) {
    const x0 = lerp(c[0][i], c[1][i], r), x1 = lerp(c[2][i], c[3][i], r);
    const x2 = lerp(c[4][i], c[5][i], r), x3 = lerp(c[6][i], c[7][i], r);
    out[i] = lerp(lerp(x0, x1, y), lerp(x2, x3, y), b);
  }
  return rgbToHex(out);
}
const PAINTS = { r: { name: 'pink', hex: '#ff4f9a' }, y: { name: 'yellow', hex: '#ffd23f' }, b: { name: 'blue', hex: '#3d9bff' } };
function mixPortions(portions) {
  if (!portions.length) return null;
  let r = 0, y = 0, b = 0; portions.forEach(p => { if (p === 'r') r++; if (p === 'y') y++; if (p === 'b') b++; });
  const m = Math.max(r, y, b); // normalise so one colour alone stays fully saturated
  return rybToHex(r / m, y / m, b / m);
}

// ---------- audio (Web Audio, created only after a user gesture) ----------
const Sound = {
  on: true, ac: null, noiseBuf: null,
  ensure() {
    if (!this.on) return null;
    try {
      this.ac = this.ac || new (window.AudioContext || window.webkitAudioContext)();
      if (this.ac.state === 'suspended') this.ac.resume();
      if (!this.noiseBuf) {

// ---------- particles ----------
const particles = [];
const PCOLORS = ['#fff', '#ffc84b', '#ff6ec2', '#59dff1', '#a587ff'];
function burst(x, y, n = 18, colors = PCOLORS, kind = 'star', spread = 1) {
  for (let i = 0; i < n; i++) {
    if (particles.length > 260) particles.shift();
    particles.push({ x, y, vx: rand(-190, 190) * spread, vy: rand(-260, -60) * spread, life: rand(.45, 1), max: 1, c: colors[i % colors.length], r: rand(3, 8), kind, g: kind === 'drop' ? 900 : 500, rot: rand(0, TAU) });
  }
}
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life / .6, 0, 1);
    if (p.kind === 'heart') { ctx.beginPath(); heartPath(p.x, p.y, p.r * 1.3); ctx.fillStyle = p.c; ctx.fill(); }
    else if (p.kind === 'drop' || p.kind === 'dot') ellipse(p.x, p.y, p.r * .8, p.r, p.c);
    else star(p.x, p.y, p.r, p.c, 4, p.rot);
  }
  ctx.globalAlpha = 1;
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.rot += dt * 3;
    if (p.life < 0) particles.splice(i, 1);
  }
}

// ---- 10_creatures.js ----
// ===================================================================
// 10_creatures.js — Pip, Zuzu and Jelly: one coherent rig each.
//   * every limb/ear/wing/tentacle is anchored to a point on the body
//   * secondary motion uses damped springs (ears lag, tails swish)
//   * poses: idle, run, jump (rise), fall, land squash, ride/sit, tap reaction
// ===================================================================
const CREATURES = {
  pip: { name: 'Pip', title: 'Pip the rainbow fluff-bun!', cadence: 13, jump: [680, 600] },
  zuzu: { name: 'Zuzu', title: 'Zuzu the twinkly star sprite!', cadence: 10, jump: [690, 620] },
  jelly: { name: 'Jelly', title: 'Jelly the wobbly jelly blob!', cadence: 8.5, jump: [700, 640] },
};

function makeAnim() {
  return {
    t: 0, phase: 0, run: 0, vx: 0, vy: 0, grounded: true, seated: false, facing: 1,
    squash: { x: 1, v: 0 }, lean: { x: 0, v: 0 }, ear: { x: 0, v: 0 }, tail: { x: 0, v: 0 }, look: { x: 0, v: 0 },
    blink: 0, nextBlink: 2.2, react: 0, happy: 0, land: 0, flip: 0, flipDir: 1, hop: 0,
    trail: [], soft: null, wx: 0, wy: 0,
  };
}

// Called every frame with the physical state; produces the pose.
function updateAnim(A, kind, dt, st) {
  const prevGrounded = A.grounded, prevVy = A.vy;
  A.t += dt; A.vx = st.vx; A.vy = st.vy; A.grounded = st.grounded; A.seated = !!st.seated; A.facing = st.facing;
  const speed = Math.abs(st.vx);
  A.run = lerp(A.run, A.grounded && !A.seated ? clamp(speed / 310, 0, 1) : 0, 1 - Math.exp(-dt * 10));
  A.phase += dt * CREATURES[kind].cadence * (A.grounded ? clamp(speed / 310, 0, 1.2) : 0);

  // landing impact → squash + dust
  if (!prevGrounded && A.grounded && prevVy > 220 && !A.seated) {
    A.squash.v -= clamp(prevVy, 0, 1100) * (kind === 'jelly' ? .009 : .006);
    A.land = .35;
    if (A.soft) A.soft.pts.forEach(p => { p.vy += prevVy * .25; p.vx += (p.rx > 0 ? 1 : -1) * prevVy * .18; });
    st.onLand && st.onLand(prevVy);
  }
  A.land = Math.max(0, A.land - dt);
  A.react = Math.max(0, A.react - dt);
  A.happy = Math.max(0, A.happy - dt);
  if (A.flip > 0) A.flip = Math.max(0, A.flip - dt / (kind === 'pip' ? .5 : .6));

  // Squash/stretch target: stretch when rising, slight stretch falling, settle on ground.
  let sq = 1;
  if (!A.grounded && !A.seated) sq = 1 + clamp(-st.vy / 4200, -.06, .14);
  if (kind === 'jelly' && A.grounded) {
    A.hop = -Math.abs(Math.sin(A.phase * .5)) * 22 * A.run;
    sq = 1 + (A.hop < -3 ? .07 : -.1) * A.run;
  } else A.hop = 0;
  spring(A.squash, sq, kind === 'jelly' ? 150 : 230, kind === 'jelly' ? 5 : 9, dt);
  A.squash.x = clamp(A.squash.x, .62, 1.4);

  spring(A.lean, A.seated ? 0 : clamp(st.vx / 310, -1.3, 1.3) * .13 * A.facing, 90, 10, dt);
  // Ears/antennae/tail lag behind motion (positive = swept back / floated up)
  const earT = clamp(speed / 310, 0, 1.4) * .55 + (A.grounded ? 0 : clamp(st.vy / 900, -.7, .9) * -.75);
  spring(A.ear, earT, 110, 6.5, dt);
  spring(A.tail, earT * .8 + Math.sin(A.t * (2.5 + A.run * 8)) * .18, 70, 5, dt);
  spring(A.look, A.run * .8 + (A.react > 0 ? Math.sin(A.t * 9) * .5 : 0), 60, 9, dt);

  A.nextBlink -= dt;
  if (A.nextBlink <= 0) { A.blink = .13; A.nextBlink = rand(1.8, 4.5); }
  A.blink = Math.max(0, A.blink - dt);

  // Zuzu comet trail (world space)
  if (kind === 'zuzu') {
    A.trail.unshift({ x: st.x, y: st.y - 86 + Math.sin(A.t * 3.1) * 6 });
    if (A.trail.length > 16) A.trail.length = 16;
  }
  // Jelly soft body (world-space point ring that lags behind the root → real jiggle)
  if (kind === 'jelly') updateJellySoft(A, dt, st);
}

// Called when the player jumps (n = 1 or 2)
function animJump(A, kind, n) {
  A.squash.v += n === 1 ? 2.5 : 3.5;
  if (n === 2) { A.flip = 1; A.flipDir = 1; }
  if (A.soft) A.soft.pts.forEach(p => { p.vy += 140; });
}
function animReact(A, kind) {
  A.react = 1.3; A.happy = 1.6;
  if (kind === 'zuzu') { A.flip = 1; A.flipDir = -1; }
  A.squash.v += kind === 'jelly' ? -5 : 3;
  if (A.soft) A.soft.pts.forEach((p, i) => { p.vx += rand(-260, 260); p.vy += rand(-260, 260); });

// ---------------- Shared face ----------------
function drawEye(x, y, rx, ry, A, iris = '#3f2a6b', lookScale = 3) {
  const closed = A.blink > 0, happy = A.happy > 0 && A.react > 0;
  if (closed || happy) {
    ctx.strokeStyle = iris; ctx.lineWidth = 3.4; ctx.lineCap = 'round'; ctx.beginPath();
    if (happy) ctx.arc(x, y + ry * .25, rx * .8, Math.PI * 1.15, Math.PI * 1.85); else ctx.arc(x, y, rx * .8, Math.PI * .15, Math.PI * .85);

  }

  const lx = A.look.x * lookScale, ly = !A.grounded && !A.seated ? clamp(A.vy / 300, -2, 2) : 0;
  ellipse(x + lx, y + ly + 1, rx * .66, ry * .72, iris);
  ellipse(x + lx + rx * .12, y + ly + ry * .26, rx * .38, ry * .26, '#8f6bd8aa');
  ellipse(x + lx - rx * .24, y + ly - ry * .3, rx * .27, ry * .22, '#fff');

  const air = !A.grounded && !A.seated;

    ctx.moveTo(x - 9 * size, y - 2); ctx.quadraticCurveTo(x, y + 14 * size, x + 9 * size, y - 2); ctx.closePath(); ctx.fill();
    ellipse(x, y + 5 * size, 4.5 * size, 3 * size, '#ff8fb8');
  } else if (air && A.vy < 0) { ellipse(x, y + 2, 5 * size, 6.5 * size, col); ellipse(x, y + 4, 3 * size, 3 * size, '#ff8fb8'); }
  else if (A.land > .1) { ctx.moveTo(x - 8 * size, y + 2); ctx.quadraticCurveTo(x - 4, y - 3, x, y + 2); ctx.quadraticCurveTo(x + 4, y + 6, x + 8 * size, y + 1); ctx.stroke(); }
  else { ctx.arc(x, y - 1, 7 * size, .2, Math.PI - .2); ctx.stroke(); }
}

// ---------------- PIP: fluffy rainbow fluff-bun with moth wings ----------------
function pipLegs(A) {
  const ph = A.phase, run = A.run, air = !A.grounded && !A.seated;
  let near = Math.sin(ph) * .8 * run, far = -Math.sin(ph) * .8 * run;

}

  const OUT = '#563596';

  const L = pipLegs(A), legLen = 25;

  const footN = [hipN[0] + Math.sin(L.near) * legLen, hipN[1] + Math.cos(L.near) * legLen - L.liftN];
  const footF = [hipF[0] + Math.sin(L.far) * legLen, hipF[1] + Math.cos(L.far) * legLen - L.liftF];
  const headX = 4 - A.lean.x * 18, headY = -104 + A.ear.x * 2;
  const earAng = A.ear.x * .85 + Math.sin(t * 2.2) * .05;
  const flap = air ? Math.sin(t * 30) * .55 : Math.sin(t * 3) * .1;

  // tail (rainbow curl, anchored at the rump)
  ctx.save(); ctx.translate(-27, -42); ctx.rotate(-.2 - A.tail.x * .5);
  ctx.lineCap = 'round';
  const tailPath = () => { ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(-34, 4, -50, -30, -32, -48); ctx.bezierCurveTo(-20, -60, -4, -50, -12, -38); };
  tailPath(); ctx.strokeStyle = OUT; ctx.lineWidth = 30; ctx.stroke();
  ['#ff6fae', '#ffc95c', '#63dcd8', '#9d86ff'].forEach((c, i) => { tailPath(); ctx.strokeStyle = c; ctx.lineWidth = 22 - i * 5; ctx.stroke(); });
  ctx.restore();

  const wing = (rot, alpha, scaleW) => {
    ctx.save(); ctx.translate(-18, -76); ctx.rotate(rot);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(-18 * scaleW, -40, -60 * scaleW, -34, -50 * scaleW, -6); ctx.bezierCurveTo(-44 * scaleW, 10, -20 * scaleW, 12, 0, 0);
    ctx.fillStyle = withAlpha('#9ee9ff', alpha); ctx.fill(); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 2); ctx.bezierCurveTo(-14 * scaleW, 26, -40 * scaleW, 26, -34 * scaleW, 8); ctx.closePath();

    if (A.react > 0 && side > 0) return 2.6 + Math.sin(t * 18) * .45;
    if (A.seated) return side > 0 ? 1.0 : .8;

    { path: () => limbPath(hipF[0], hipF[1], footF[0], footF[1], 10, 8), fill: '#9f86ee' },
    { path: () => limbPath(hipN[0], hipN[1], footN[0], footN[1], 10.5, 8.5), fill: fur },
    { path: () => fluffPath(0, -52, 33, 31, 12, .06, t * .5), fill: fur },
    { path: () => fluffPath(headX, headY, 46, 41, 16, .05, 1), fill: fur },
    { path: nearEarPath, fill: '#a07cf4' },
    { path: () => ctx.ellipse(footF[0] + 5, footF[1] - 1, 12, 8, Math.sin(L.far) * .4, 0, TAU), fill: '#ff8cc6' },
    { path: () => ctx.ellipse(footN[0] + 5, footN[1] - 1, 13, 8.5, Math.sin(L.near) * .4, 0, TAU), fill: '#ffa5d4' },
  ], OUT, 6);

  ctx.beginPath(); earShape(42, 9, -4 - A.ear.x * 10)(); ctx.fillStyle = '#ffc0e6'; ctx.fill(); ctx.restore();

  }

  drawEye(headX + 18, headY - 4, 12, 15.5, A);
  ellipse(headX - 27, headY + 14, 9, 5.5, '#ff7fb0aa'); ellipse(headX + 34, headY + 14, 9, 5.5, '#ff7fb0aa');
  ctx.beginPath(); heartPath(headX + 4, headY + 9, 5); ctx.fillStyle = '#7b3f8a'; ctx.fill();

  // near arm in front of the body
  const shN = [21, -63], aN = armAng(1);
  const handN = [shN[0] + Math.sin(aN) * 20, shN[1] + Math.cos(aN) * 20];
  inked([{ path: () => limbPath(shN[0], shN[1], handN[0], handN[1], 8, 9), fill: '#ff9fd5' }], OUT, 5.5);
  ellipse(handN[0] + 2, handN[1] + 1, 3, 3, '#fff0f8');
  ctx.restore();
}

// ---------------- ZUZU: hovering star sprite; her bottom points are her feet ----------------
function zuzuVerts(A) {
  const t = A.t, ph = A.phase, run = A.run, air = !A.grounded && !A.seated;
  const breathe = 1 + Math.sin(t * 2.4) * .03;
  const deg = Math.PI / 180, v = [];
  const outer = [
    { a: -90, r: 62 + (air && A.vy < 0 ? 5 : 0) },                                      // crown point
    { a: -18 + (A.react > 0 ? -35 + Math.sin(t * 18) * 25 : air ? (A.vy < 0 ? -16 : -6) : -Math.sin(ph) * 14 * run), r: 56 },   // front arm
    { a: 56 + Math.sin(ph) * 18 * run + (air ? -6 : 0), r: 54 + Math.cos(ph) * 7 * run + (air ? 4 : 0) },  // front foot
    { a: 124 - Math.sin(ph) * 18 * run + (air ? 6 : 0), r: 54 - Math.cos(ph) * 7 * run + (air ? 4 : 0) },  // back foot
    { a: 198 + (air ? (A.vy < 0 ? 16 : 6) : Math.sin(ph) * 14 * run) + Math.sin(t * 2) * 4, r: 54 },        // back arm
  ];

const JN = 18;

    A.soft = { x: rx, y: ry, pts: [] };

    p.vx += ((q.x + o.x) / 2 - p.x) * 18 * h; p.vy += ((q.y + o.y) / 2 - p.y) * 18 * h;
    p.vx *= Math.exp(-7 * h); p.vy *= Math.exp(-7 * h);

function creatureShadow(kind, A, drop = 0) {
  // drop = distance down to the floor/platform under the creature: the shadow stays on the ground
  const hover = kind === 'zuzu' ? zuzuHover(A) : 0;

  ellipse(0, 4 + drop, 44 * k, 9 * k, `rgba(60,25,110,${.22 * clamp(1 - drop / 500, .3, 1)})`);
}
function drawCreature(kind, A, ox, oy, opts = {}) {
  ctx.save(); ctx.translate(ox, oy);
  if (!opts.noShadow) creatureShadow(kind, A, opts.drop || 0);
  if (kind === 'zuzu' && !opts.noTrail) drawZuzuTrail(A, ox, oy);
  ctx.scale(A.facing, 1);

const portraits = [];

}
function renderPortraits(dt) {

    p.c.setTransform(1, 0, 0, 1, 0, 0); p.c.clearRect(0, 0, p.el.width, p.el.height);

}

function cleanStrokes(arr) {

    try { d = JSON.parse(localStorage.getItem(STORE_V1) || 'null'); migrated = !!d; } catch (e) { d = null; }
  }

    world.strokes = cleanStrokes(d.strokes);

    ellipse(0, 0, 30, 19, 'rgba(255,255,255,.75)', '#ff8fc8', 4);
    ctx.save(); ctx.scale(.2, .2); drawCreature(P.creature, A, 0, 80, { noShadow: true, noTrail: true }); ctx.restore();
    ctx.restore();
    burst(P.x - Math.sign(P.vx) * 30, P.y - 20, 1, ['#fff', '#ffe36e'], 'star', .2);
    return;
  }
  ctx.save();
  // riders shrink to fit their seat (bubble / gondola / coaster car), scaled about the feet
  const rs = P.ride ? { bubble: .78, wheel: .5, coaster: .58 }[P.ride.type] : 0;
  if (rs) { ctx.translate(P.x, P.y); ctx.scale(rs, rs); ctx.translate(-P.x, -P.y); }
  drawCreature(P.creature, A, P.x, P.y, { noShadow: !!P.ride, drop: P.grounded ? 0 : floorBelow(P.x, P.y) - P.y });
  ctx.restore();
}
function floorBelow(x, y) {

  for (const z of PLATFORMS) if (x > z.a && x < z.b && z.y >= y - 1 && z.y < f) f = z.y;
  return f;
}
function render(t) {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  background(t); ground(t);
  ctx.save(); ctx.translate(-camera, 0);
  ceilingTube(t, false); hangingStars(t);
  if (cull(365, 260)) drawBallPitBack();
  playStructure(t); paintWall(t); mixerMachine(t); drawPours(t); drawPipe(t);
  bubbleMachine(t); powerCable(t); wonderEngine(t); magnetMachine(t); launchPad(t);
  ferrisWheel(t); coasterTrack(t);
  const onCoaster = player.ride && player.ride.type === 'coaster';
  if (!onCoaster && cull(4870, 520)) coasterTrain(t);
  if (world.needPaintT > 0 && cull(2790, 80)) { ctx.globalAlpha = Math.min(1, world.needPaintT); paintDropIcon(LAYOUT.engine.funnel[0], 92); ctx.globalAlpha = 1; }
  secretStars(t);
  balls.forEach(b => { if (cull(b.x, 40)) drawBall(b); });
  world.bubbles.forEach(b => { if (!b.ride && cull(b.x, 40)) drawBubble(b); });
  drawPlayer(t);
  // things that sit IN FRONT of the creature (so it is inside the ride / the pit)
  if (onCoaster) coasterTrain(t);
  if (player.ride && player.ride.type === 'wheel') { const W = LAYOUT.wheel, a = world.wheelAngle + player.ride.i * Math.PI / 5, x = W.cx + Math.cos(a) * W.r, y = W.cy + Math.sin(a) * W.r; rounded(x - 26, y + 24, 52, 18, 9, ['#ffbb68', '#7be1ed', '#ff85c2', '#a88af5', '#92e1a6'][player.ride.i % 5], '#fff', 3); }
  world.bubbles.forEach(b => { if (b.ride && cull(b.x, 80)) drawBubble(b); });
  if (cull(365, 260)) drawBallPitFront();
  drawParticles();
  if (started) drawHintHand(t);
  ctx.restore();
  foreground(t);
  // slim journey strip (shows how far along the one big world you are)
  const sx = vw / 2 - 90, sy = 18; rounded(sx, sy, 180, 8, 4, 'rgba(255,255,255,.55)');
  ['#ff8fc8', '#ffcf5e', '#6fd8f0', '#ff9a7a'].forEach((c, i) => ellipse(sx + [12, 62, 108, 160][i], sy + 4, 3, 3, c));
  ellipse(sx + 180 * player.x / WORLD_W, sy + 4, 7, 7, '#ffd15f', '#fff', 2);
}
function paintDropIcon(x, y) {
  rounded(x - 44, y - 22, 88, 44, 20, 'rgba(255,255,255,.94)', '#e3b0ee', 3);
  ['#ff4f9a', '#ffd23f', '#3d9bff'].forEach((c, i) => { const dx = x - 26 + i * 15; ctx.beginPath(); ctx.moveTo(dx, y - 12); ctx.quadraticCurveTo(dx + 8, y + 2, dx, y + 8); ctx.quadraticCurveTo(dx - 8, y + 2, dx, y - 12); ctx.fillStyle = c; ctx.fill(); });
  ctx.beginPath(); ctx.moveTo(x + 10, y - 6); ctx.lineTo(x + 18, y); ctx.lineTo(x + 10, y + 6); ctx.strokeStyle = '#8452b0'; ctx.lineWidth = 3; ctx.stroke();
  ellipse(x + 32, y, 10, 10, 'rgba(160,120,255,.35)', '#fff', 2);
}
function update(dt, t) {
  if (toastTimer > 0) { toastTimer -= dt; if (toastTimer <= 0) $('toast').classList.remove('shown'); }
  const nearWall = started && camera + vw > LAYOUT.wall.x1 + 120 && camera < LAYOUT.wall.x2 - 120;
  const pt = $('paintTools'); if (pt.classList.contains('show') !== nearWall) pt.classList.toggle('show', nearWall);
  if (!started) { updateParticles(dt); return; }
  updatePlayer(dt); updateWorld(dt, t); updateCamera(dt);
  if (t - lastSave > 10) { lastSave = t; save(); }
}
let lastSave = 0, portraitClock = 0;
function loop(ms) {
  const t = ms / 1000;
  if (!lastFrame) lastFrame = t;
  const dt = clamp(t - lastFrame, 0, 1 / 30); lastFrame = t;
  if (!paused) {
    gameTime += dt; frameCount++;
    update(dt, gameTime); render(gameTime);
    portraitClock += dt; if (portraitClock > 1 / 20) { renderPortraits(portraitClock); portraitClock = 0; }
  }
  requestAnimationFrame(loop);
}

// ---------------- boot ----------------
if (!CanvasRenderingContext2D.prototype.roundRect) { // older Safari fallback
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) { r = Math.min(typeof r === 'number' ? r : 8, Math.abs(w) / 2, Math.abs(h) / 2); this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r); this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath(); };
}
const restoreInfo = restore();
addEventListener('resize', resize); resize();
camera = clamp(player.x - vw * .4, 0, Math.max(0, WORLD_W - vw));
document.querySelectorAll('.creatureChoice canvas').forEach(c => registerPortrait(c, c.parentElement.dataset.creature, 46));
document.querySelectorAll('.introPick canvas').forEach(c => registerPortrait(c, c.parentElement.dataset.creature, 96));
initInput();
selectCreature(player.creature, true);
document.querySelectorAll('.introPick').forEach(z => z.classList.toggle('chosen', z.dataset.creature === player.creature));
setSound(Sound.on); updateCounter(); updatePaintTools();
if (restoreInfo.restored) $('playBtn').textContent = '▶ KEEP PLAYING!';
requestAnimationFrame(loop);

// Test/debug hook (used by the automated smoke tests; harmless for players)
window.__DDW = {
  player, world, balls, LAYOUT, keys, Sound, SECRET_STARS, get camera() { return camera; }, get vw() { return vw; }, VH,
  toScreen(x, y) { const r = canvas.getBoundingClientRect(); return { x: (x - camera) / VH * r.height + r.left, y: y / VH * r.height + r.top }; },
  teleport(x, y = GROUND) { player.ride = null; player.x = x; player.y = y; player.vx = player.vy = 0; camera = clamp(x - vw / 2, 0, WORLD_W - vw); },
  restoreInfo, activate: (x, y) => activate({ x, y }),
};

})();
</script>
