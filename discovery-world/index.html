<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#39206d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Dawson's Discovery World</title>
<style>:root{--ink:#3a2864;--pink:#ff65b5;--violet:#8754eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#28184f;color:#fff;font-family:ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,-apple-system,sans-serif;overscroll-behavior:none;touch-action:none}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 62%,rgba(48,19,100,.22))}
svg{display:block}

/* ---------- top bar ---------- */
#top{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:10}
#brand{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,rgba(80,38,155,.9),rgba(115,68,194,.86));border:2px solid rgba(255,255,255,.65);padding:6px 12px 6px 8px;border-radius:17px;box-shadow:0 6px 0 rgba(54,19,108,.18),0 10px 24px #44217750;line-height:1.05}
.brandStar{width:26px;height:26px;fill:#ffd84a;filter:drop-shadow(0 2px 0 #c76aa8)}
#brand small{display:block;color:#ffe19c;font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
#brand b{font-size:clamp(12px,2vw,17px);white-space:nowrap;text-shadow:0 2px #5c389a}
body.playing #brand small{display:none}
#upperRight{display:flex;gap:7px;align-items:center;pointer-events:auto}
.pill{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.94);border:2px solid #fff;border-bottom:4px solid #e1d2f6;border-radius:16px;color:#55408b;box-shadow:0 5px 14px #3b217744;font-weight:900;font-size:17px;padding:5px 11px;min-height:48px;min-width:48px;justify-content:center}
.pill svg{width:24px;height:24px;fill:#ffc531;stroke:#e98c1f;stroke-width:1}
.pill:active{transform:translateY(2px);border-bottom-width:2px}
#soundBtn svg{width:26px;height:26px}
#soundBtn .spk{fill:#8a5ad8;stroke:none}#soundBtn .wave{stroke:#8a5ad8}#soundBtn .cross{stroke:#ff5f9e;display:none}
#soundBtn.muted .wave{display:none}#soundBtn.muted .cross{display:block}
#chooser{display:flex;gap:5px;background:rgba(255,255,255,.55);border-radius:18px;padding:4px;border:2px solid #fff;box-shadow:0 5px 13px #33226a35}
.creatureChoice{width:52px;height:52px;padding:0;border-radius:14px;background:#fff6ee;border:3px solid transparent;display:grid;place-items:center;transition:transform .15s}
.creatureChoice canvas{width:46px;height:46px}
.creatureChoice.chosen{border-color:#ffbf33;background:#fff4b8;transform:scale(1.08);box-shadow:0 0 0 2px #fff}

/* ---------- toast ---------- */
#toast{z-index:11;position:fixed;top:calc(max(8px,env(safe-area-inset-top)) + 62px);left:50%;transform:translateX(-50%) translateY(-14px);max-width:min(78vw,480px);padding:9px 18px;border:3px solid #fff;border-radius:18px;background:linear-gradient(130deg,#ffec9b,#fff6d5);color:#673b8b;font-size:15px;font-weight:900;text-align:center;box-shadow:0 7px 0 #8a55bc33,0 12px 22px #57358f55;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
#toast.shown{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- paint tools (appear only near the paint wall) ---------- */
#paintTools{position:fixed;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 6px);left:50%;transform:translateX(-50%) translateY(10px);display:flex;gap:7px;align-items:center;padding:6px 10px;border:2px solid rgba(255,255,255,.9);border-radius:30px;background:rgba(83,52,144,.78);box-shadow:0 5px 25px #3b238c44;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s;z-index:9}
#paintTools.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.swatch{width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 5px #31204460;transform:scale(.92);padding:0}
.swatch.selected{outline:4px solid #ffdc6b;outline-offset:1px;transform:scale(1.1)}
.swatch.mix{background-image:radial-gradient(circle at 35% 30%,rgba(255,255,255,.7) 0 18%,transparent 19%)!important;position:relative}
.toolBtn{width:42px;height:42px;border-radius:50%;border:3px solid #fff;background:#8a5ad8;display:grid;place-items:center;padding:0}
.toolBtn svg{width:24px;height:24px;stroke:#fff}

/* ---------- movement & jump ---------- */
#bottom{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));padding:0 max(14px,env(safe-area-inset-left)) 0 max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right));display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none;z-index:10}
.controls{display:flex;gap:14px;pointer-events:auto;align-items:flex-end}
.ctrl{touch-action:none;border:3px solid rgba(255,255,255,.95);border-bottom:7px solid rgba(255,255,255,.6);box-shadow:0 7px 0 #39207044,0 13px 18px #2c19545c;border-radius:26px;width:76px;height:72px;padding:0;background:linear-gradient(155deg,#9a6cfb,#663ac8);display:grid;place-items:center}
.ctrl svg{width:38px;height:38px;fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 0 #4b2896)}
.ctrl.right{background:linear-gradient(155deg,#8a72fb,#4b49ce)}
.ctrl.jump{width:98px;height:84px;border-radius:30px;background:linear-gradient(150deg,#ffa37a,#ff4f99)}
.ctrl.jump svg{width:44px;height:44px;fill:#fff;stroke:#fff;stroke-width:1.5;filter:drop-shadow(0 2px 0 #c03a7a)}
.ctrl.pressed{transform:translateY(4px) scale(.95);border-bottom-width:3px;filter:brightness(1.15)}

/* ---------- title card ---------- */
#overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:linear-gradient(145deg,rgba(48,24,94,.78),rgba(46,37,108,.82));overflow:auto;touch-action:pan-y}
#intro{position:relative;max-width:640px;width:min(96vw,640px);text-align:center;background:linear-gradient(160deg,#fffdf6,#f2e8ff);border:6px solid #fff;border-radius:36px;padding:20px 22px 18px;box-shadow:0 12px 0 #47216c,0 30px 65px #29104c99;color:#4b357a}
#intro .eyebrow{font-size:11px;font-weight:900;letter-spacing:3px;color:#a35cb9;text-transform:uppercase}
#intro h1{line-height:1.01;margin:6px 0 4px;font-weight:900;font-size:clamp(28px,6vw,50px);color:#a551e7;text-shadow:2px 3px #ffe084}
#intro h1 span{color:#fa65a4}
.previewCrew{display:flex;justify-content:center;gap:12px;margin:6px 0 12px}
.introPick{background:#fff;border:4px solid #eadcff;border-radius:24px;padding:4px 4px 2px;display:flex;flex-direction:column;align-items:center;transition:transform .15s;box-shadow:0 5px 0 #d9c6f5}
.introPick canvas{width:96px;height:96px}
.introPick b{font-size:15px;color:#7b4fc4;margin-top:-2px}
.introPick.chosen{border-color:#ffbf33;background:#fff7cf;transform:translateY(-4px) scale(1.04)}
#playBtn{width:min(100%,360px);border:3px solid #fff;border-bottom:7px solid #d7408a;border-radius:22px;background:linear-gradient(180deg,#ff94ca,#ff52a7);color:#fff;padding:13px 22px;font-size:24px;font-weight:900;text-shadow:0 2px #bc3b93;box-shadow:0 7px 24px #e451a46e}
#playBtn:active{transform:translateY(3px);border-bottom-width:4px}
#intro .micro{font-size:12px;color:#8f7eac;margin:10px 0 0;font-weight:800}

#rotateTip{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:14px 18px;background:#fff9d8f0;color:#6848a5;border:3px solid #fff;border-radius:20px;font-size:16px;font-weight:900;display:none;z-index:12;pointer-events:none;text-align:center;box-shadow:0 10px 30px #2a125566}
@media (orientation:portrait) and (max-width:700px){
  body.playing #rotateTip{display:block;animation:fadeTip 5s forwards}
  #brand{display:none}
  #upperRight{gap:5px;flex-wrap:wrap;justify-content:flex-end}
  .creatureChoice{width:46px;height:46px}.creatureChoice canvas{width:40px;height:40px}
  .ctrl{width:66px;height:64px}.ctrl.jump{width:84px;height:74px}
  #paintTools{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 92px);flex-wrap:wrap;justify-content:center;max-width:94vw}
  .introPick canvas{width:76px;height:76px}
}
@keyframes fadeTip{0%,80%{opacity:1}100%{opacity:0}}
@media (max-height:430px){
  #brand{padding:4px 9px 4px 6px}#brand small{display:none}.brandStar{width:20px;height:20px}
  .pill{min-height:44px;min-width:44px;padding:3px 9px}
  .creatureChoice{width:46px;height:46px}.creatureChoice canvas{width:40px;height:40px}
  #toast{top:calc(max(6px,env(safe-area-inset-top)) + 54px);font-size:13px;padding:6px 14px}
  .swatch,.toolBtn{width:38px;height:38px}
  .ctrl{width:70px;height:64px}.ctrl.jump{width:90px;height:74px}
  #intro{padding:10px 16px 10px;border-radius:26px}#intro h1{font-size:28px;margin:2px 0}
  .previewCrew{margin:2px 0 6px}.introPick canvas{width:72px;height:72px}
  #playBtn{font-size:19px;padding:8px}#intro .micro{font-size:10px;margin-top:5px}
}

/* ================= Art-direction pass (matches the target screenshots) ================= */
#brand{background:none;border:none;box-shadow:none;padding:0}
#logo{display:flex;flex-direction:column;align-items:center;line-height:.86;transform:rotate(-3deg);filter:drop-shadow(0 4px 0 rgba(90,30,140,.45)) drop-shadow(0 6px 10px rgba(60,20,110,.35))}
#logo span{font-weight:900;paint-order:stroke fill;-webkit-text-stroke:6px #fff;letter-spacing:.5px}
#logo .lA{font-size:15px;color:#7b3fd0}
#logo .lB{font-size:25px}
#logo .lB i{font-style:normal;display:inline-block}
#logo .lB i:nth-child(6n+1){color:#ff4fa8}#logo .lB i:nth-child(6n+2){color:#ff9a2e}#logo .lB i:nth-child(6n+3){color:#ffc21c}#logo .lB i:nth-child(6n+4){color:#36c96b}#logo .lB i:nth-child(6n+5){color:#2fa8ff}#logo .lB i:nth-child(6n){color:#a15cff}
#logo .lB i:nth-child(odd){transform:translateY(-1px)}
#logo .lC{font-size:17px;color:#9b4fe6}#logo .lC em{font-style:normal;color:#ffc531;font-size:13px;margin-left:2px}
.pill{background:linear-gradient(180deg,#7a3fd0,#5a24a8);color:#fff;border:3px solid #fff;border-bottom:3px solid #fff;box-shadow:0 4px 0 #3f1880,0 8px 16px #2b105566;font-size:19px;padding:4px 14px 4px 8px;border-radius:24px}
.pill svg{width:30px;height:30px;fill:#ffc531;stroke:#e98c1f;stroke-width:1.2;filter:drop-shadow(0 0 4px #ffe58a)}
#soundBtn{border-radius:50%;width:50px;padding:0;background:radial-gradient(circle at 35% 30%,#ff9fd2,#e43c95);box-shadow:0 4px 0 #a01d64,0 8px 16px #2b105566}
#soundBtn .spk{fill:#fff}#soundBtn .wave{stroke:#fff}#soundBtn .cross{stroke:#fff}
#chooser{background:none;border:none;box-shadow:none;padding:0;gap:6px}
.creatureChoice{border-radius:50%;width:54px;height:54px;background:radial-gradient(circle at 40% 35%,#fff,#f3dcff);border:3px solid #fff;box-shadow:0 0 0 3px #c9a3f0,0 5px 10px #2b105555}
.creatureChoice canvas{border-radius:50%}
.creatureChoice.chosen{border-color:#fff;box-shadow:0 0 0 4px #ffc531,0 0 14px 4px #ffe58a,0 5px 10px #2b105555;transform:scale(1.1)}
/* area banner */
#zoneBanner{position:fixed;top:calc(max(8px,env(safe-area-inset-top)) + 4px);left:50%;transform:translate(-50%,-80px);display:flex;align-items:center;gap:8px;padding:5px 20px 5px 8px;border-radius:30px;background:linear-gradient(180deg,#8a4ee0,#5f28b0);border:3px solid #fff;box-shadow:0 4px 0 #3f1880,0 10px 20px #2b105566;color:#fff;font-size:19px;font-weight:900;z-index:11;transition:transform .45s cubic-bezier(.3,1.6,.5,1);pointer-events:none;white-space:nowrap}
#zoneBanner.show{transform:translate(-50%,0)}
#zoneIcon{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center}
#zoneIcon svg{width:24px;height:24px}
body.playing #toast{top:calc(max(8px,env(safe-area-inset-top)) + 64px)}
/* controls */
#movePill{display:flex;gap:0;padding:6px;border-radius:44px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(220,190,255,.45));border:3px solid rgba(255,255,255,.95);box-shadow:0 6px 0 rgba(80,30,140,.35),0 12px 22px rgba(40,10,80,.35)}
#movePill .ctrl{width:84px;height:66px;border-radius:34px;border:0;box-shadow:none;background:linear-gradient(180deg,#b58cff,#7d45d8)}
#movePill .ctrl.right{margin-left:6px}
#movePill .ctrl svg{width:42px;height:42px;stroke-width:3.6}
#movePill .ctrl.pressed{transform:scale(.94);filter:brightness(1.18)}
.ctrl.jump,.ctrl.paw{border-radius:50%;border:4px solid #fff;border-bottom:4px solid #fff;box-shadow:0 0 0 4px #c48cf5,0 7px 0 4px #6b2fb0,0 14px 22px #2c195470}
.ctrl.jump{width:92px;height:92px;background:radial-gradient(circle at 35% 28%,#e5b8ff 0,#a35cf0 45%,#7a2fd0 100%)}
.ctrl.jump svg{width:48px;height:48px;fill:#fff;stroke:#fff;filter:drop-shadow(0 3px 0 #5a1fa0)}
.ctrl.paw{width:70px;height:70px;margin-bottom:12px;background:radial-gradient(circle at 35% 28%,#9ff4ff 0,#37b6ea 50%,#1f7fc8 100%);box-shadow:0 0 0 4px #8fd8ff,0 6px 0 4px #1d5f9f,0 12px 18px #2c195470}
.ctrl.paw svg{width:36px;height:36px;fill:#fff;stroke:none;filter:drop-shadow(0 2px 0 #145a90)}
.ctrl.jump.pressed,.ctrl.paw.pressed{transform:translateY(3px) scale(.94)}
/* paint tools as glossy tiles */
#paintTools{background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(225,200,255,.55));border:3px solid #fff;border-radius:22px;padding:6px 8px;gap:6px;box-shadow:0 6px 0 rgba(80,30,140,.3),0 10px 22px rgba(40,10,80,.35)}
.swatch,.toolBtn{width:46px;height:46px;border-radius:14px;border:3px solid #fff;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15),inset 0 5px 0 rgba(255,255,255,.45),0 3px 6px rgba(40,10,80,.3);transform:none}
.swatch.selected{outline:none;box-shadow:0 0 0 3px #ffc531,0 0 12px 3px #ffe58a,inset 0 -6px 0 rgba(0,0,0,.15),inset 0 5px 0 rgba(255,255,255,.45);transform:translateY(-3px)}
.toolBtn{background:linear-gradient(180deg,#b58cff,#7d45d8)}
@media (max-height:430px){
  #logo .lA{font-size:12px}#logo .lB{font-size:20px}#logo .lC{font-size:13px}
  .creatureChoice{width:46px;height:46px}.pill{min-height:44px;font-size:17px}#soundBtn{width:46px}
  #movePill .ctrl{width:76px;height:62px}.ctrl.jump{width:82px;height:82px}.ctrl.paw{width:62px;height:62px}
  #zoneBanner{font-size:16px;padding:3px 16px 3px 6px}#zoneIcon{width:28px;height:28px}
  .swatch,.toolBtn{width:40px;height:40px}
}
@media (orientation:portrait) and (max-width:700px){ #movePill .ctrl{width:64px;height:56px}.ctrl.jump{width:76px;height:76px}.ctrl.paw{width:56px;height:56px} #zoneBanner{display:none} }

/* sticker tiles */
.stk{width:46px;height:46px;border-radius:14px;border:3px solid #fff;padding:1px;background:linear-gradient(180deg,#fff,#f1e3ff);box-shadow:inset 0 -6px 0 rgba(120,60,180,.12),0 3px 6px rgba(40,10,80,.3);display:grid;place-items:center}
.stk svg{width:38px;height:38px}
.stk.selected{box-shadow:0 0 0 3px #ffc531,0 0 12px 3px #ffe58a,inset 0 -6px 0 rgba(120,60,180,.12);transform:translateY(-3px)}
@media (max-height:430px){.stk{width:40px;height:40px}.stk svg{width:34px;height:34px}}
@media (max-width:760px){#paintTools{gap:4px;padding:5px 6px}.swatch,.toolBtn,.stk{width:36px;height:36px;border-radius:11px}.stk svg{width:30px;height:30px}}

.pill.bits{background:linear-gradient(180deg,#ff7ab8,#d43f8f);box-shadow:0 4px 0 #8f1f5c,0 8px 16px #2b105566}
.pill.bits svg{width:24px;height:24px;fill:#fff3a6;stroke:#ffb01f}
@media (max-width:760px){.pill{padding:3px 9px 3px 6px;font-size:15px}}

/* creature style panel */
#styleBtn{border-radius:50%;width:50px;padding:0;background:radial-gradient(circle at 35% 30%,#c9a6ff,#7d45d8);box-shadow:0 4px 0 #4b2096,0 8px 16px #2b105566}
#styleBtn svg{width:30px;height:30px;fill:none;stroke:none;filter:none}
#stylePanel{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(40,16,80,.45);padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
#stylePanel[hidden]{display:none}
.sp-card{display:flex;gap:14px;align-items:center;background:linear-gradient(160deg,#fffdf6,#f2e8ff);border:5px solid #fff;border-radius:30px;padding:12px 16px;box-shadow:0 10px 0 #47216c,0 24px 50px #29104c99;max-height:100%;overflow:auto}
.sp-left{display:flex;flex-direction:column;align-items:center;gap:10px}
#stylePreview{width:150px;height:150px;border-radius:24px;background:radial-gradient(circle at 50% 40%,#fff,#e9dcff)}
#styleDone{width:84px;height:56px;border-radius:28px;border:4px solid #fff;background:linear-gradient(180deg,#7be08a,#36b34f);color:#fff;font-size:30px;font-weight:900;box-shadow:0 5px 0 #23803a}
#spRows{display:flex;flex-direction:column;gap:7px}
.sp-row{display:flex;gap:6px;align-items:center}
.sp-row .lbl{width:30px;font-size:22px;text-align:center}
.sp-opt{width:40px;height:40px;border-radius:12px;border:3px solid #fff;padding:0;box-shadow:0 2px 5px rgba(40,10,80,.3);display:grid;place-items:center;background:#fff}
.sp-opt.sel{box-shadow:0 0 0 3px #ffc531,0 0 10px 3px #ffe58a;transform:translateY(-2px)}
.sp-opt svg{width:28px;height:28px}
@media (max-height:430px){#stylePreview{width:120px;height:120px}.sp-opt{width:34px;height:34px;border-radius:10px}.sp-opt svg{width:24px;height:24px}#spRows{gap:4px}.sp-row .lbl{font-size:18px;width:24px}#styleDone{height:46px;font-size:24px}}
@media (max-height:430px){#styleBtn{width:46px}}
</style>
</head>
<body>
<canvas id="game" aria-label="Dawson's Discovery World — one giant play world"></canvas>
<div id="vignette"></div>

<div id="top">
  <div id="brand"><div id="logo" aria-label="Dawson's Discovery World"><span class="lA">Dawson's</span><span class="lB"><i>D</i><i>i</i><i>s</i><i>c</i><i>o</i><i>v</i><i>e</i><i>r</i><i>y</i></span><span class="lC">World<em>★</em></span></div></div>
  <div id="upperRight">
    <button class="pill" id="discoveries" aria-label="Discoveries"><svg viewBox="0 0 24 24"><path d="M12 1.8l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 16.7l-6.1 3.5 1.5-6.8L2.2 8.8l6.9-.7z"/></svg><span id="discCount">0</span></button>
    <button class="pill bits" id="bitsPill" aria-label="Star bits"><svg viewBox="0 0 24 24"><path d="M12 3l2 5.5 5.8.4-4.5 3.7 1.5 5.7L12 15.1l-4.8 3.2 1.5-5.7-4.5-3.7 5.8-.4z"/></svg><span id="bitsCount">0</span></button>
    <div id="chooser" role="group" aria-label="Choose your creature">
      <button class="creatureChoice" data-creature="pip" aria-label="Pip"><canvas></canvas></button>
      <button class="creatureChoice" data-creature="zuzu" aria-label="Zuzu"><canvas></canvas></button>
      <button class="creatureChoice" data-creature="jelly" aria-label="Jelly"><canvas></canvas></button>
    </div>
    <button class="pill icon" id="styleBtn" aria-label="Style your creature"><svg viewBox="0 0 24 24"><path d="M14.5 3.5l6 6-8.8 8.8-6-6z" fill="#ffd36b" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/><path d="M5.6 12.4l6 6c-1.6 2.6-4.4 3.4-7.6 3.1.4-1.3.5-2.6-.4-3.6-1-1-1.4-3.3 2-5.5z" fill="#ff5aa5" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/><circle cx="17.5" cy="6.5" r="1.4" fill="#fff"/></svg></button>

<script>
(() => {
'use strict';
// ---- 00_core.js ----
// ===================================================================
// 00_core.js — constants, math, drawing helpers, color, audio, particles
// ===================================================================
const canvas = document.getElementById('game');
let ctx = canvas.getContext('2d', { alpha: false });

const VH = 480;          // world units visible vertically (closer camera = bigger creatures)
const GROUND = 450;      // floor line in world units
const WORLD_W = 14100;    // ONE continuous world, left to right
const GRAV = 1450;
const TAU = Math.PI * 2;

const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const smooth = t => t * t * (3 - 2 * t);

let vw = 960, scale = 1, camera = 0, camY = 60, started = false, paused = false;
let gameTime = 0, lastFrame = 0, frameCount = 0;
const keys = { left: false, right: false };

// Damped spring (semi-implicit Euler). Used for all secondary motion.
function spring(s, target, k, damp, dt) {
  s.v += (target - s.x) * k * dt;
  s.v *= Math.exp(-damp * dt);
  s.x += s.v * dt;
}

// Temporarily draw into another context (creature portraits share the rig code)
function withCtx(c, fn) { const old = ctx; ctx = c; try { fn(); } finally { ctx = old; } }

// ---------- drawing primitives ----------
function rounded(x, y, w, h, r, fill, stroke, line = 3) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = line; ctx.stroke(); }
}
function ellipse(x, y, rx, ry, fill, stroke, line = 3, rot = 0) {
  ctx.beginPath(); ctx.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot, 0, TAU);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = line; ctx.stroke(); }
}
function grad(x, y, w, h, stops) {

}
function rg(x, y, r, colors) {
  const g = ctx.createRadialGradient(x - r * .28, y - r * .36, r * .09, x, y, r);
  colors.forEach(([p, c]) => g.addColorStop(p, c)); return g;
}
function text(str, x, y, size, color = '#fff', stroke = '#6e4c9c', weight = 900, align = 'center') {
  ctx.font = `${weight} ${size}px ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = Math.max(3, size * .24); ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function starPath(x, y, r, points = 5, angle = -Math.PI / 2, inner = .47) {
  for (let i = 0; i < points * 2; i++) {
    const a = angle + i * Math.PI / points, rr = r * (i % 2 ? inner : 1);
    i ? ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }

}
function star(x, y, r, fill, points = 5, angle = -Math.PI / 2) { ctx.beginPath(); starPath(x, y, r, points, angle); ctx.fillStyle = fill; ctx.fill(); }
function sparkle(x, y, r = 6, col = '#fff9bd') { star(x, y, r, col, 4, Math.PI / 4); }
function heartPath(x, y, s) {
  ctx.moveTo(x, y + s * .35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * .35, x - s * .45, y - s * 1.05, x, y - s * .45);
  ctx.bezierCurveTo(x + s * .45, y - s * 1.05, x + s * 1.1, y - s * .35, x, y + s * .35);
  ctx.closePath();
}
// Tapered capsule from (x1,y1) radius w1 to (x2,y2) radius w2 — used for limbs so they
// are one solid connected shape rather than floating ovals.
function limbPath(x1, y1, x2, y2, w1, w2) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  ctx.moveTo(x1 + Math.cos(a + Math.PI / 2) * w1, y1 + Math.sin(a + Math.PI / 2) * w1);
  ctx.arc(x1, y1, w1, a + Math.PI / 2, a - Math.PI / 2);
  ctx.arc(x2, y2, w2, a - Math.PI / 2, a + Math.PI / 2);
  ctx.closePath();
}
// Fluffy (scalloped) ellipse outline, for Pip's fur.
function fluffPath(x, y, rx, ry, bumps = 14, amt = .055, phase = 0) {
  const n = 64;
  for (let i = 0; i <= n; i++) {
    const a = i / n * TAU, k = 1 + amt * Math.abs(Math.sin(a * bumps / 2 + phase));
    const px = x + Math.cos(a) * rx * k, py = y + Math.sin(a) * ry * k;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}
// Two-pass "inked" drawing: all outlines first, then all fills. Parts drawn in one call
// merge into a single seamless silhouette — the core trick that keeps limbs attached.
function inked(parts, outline, lw = 6) {
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = outline; ctx.lineWidth = lw;
  for (const p of parts) { ctx.beginPath(); p.path(); ctx.stroke(); }
  for (const p of parts) { ctx.beginPath(); p.path(); ctx.fillStyle = p.fill; ctx.fill(); }
}

// ---------- color ----------
function hexToRgb(h) {
  h = String(h).replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h.slice(0, 6), 16) || 0; return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
const rgbToHex = ([r, g, b]) => '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
const mixHex = (a, b, t) => { const A = hexToRgb(a), B = hexToRgb(b); return rgbToHex(A.map((v, i) => lerp(v, B[i], t))); };
const shade = (h, amt) => mixHex(h, amt > 0 ? '#ffffff' : '#2a1550', Math.abs(amt));
const withAlpha = (h, a) => { const [r, g, b] = hexToRgb(h); return `rgba(${r},${g},${b},${a})`; };
const isHex = s => typeof s === 'string' && /^#[0-9a-f]{6}$/i.test(s);

// Real pigment-style mixing (RYB cube → RGB, after Gossett & Chen) so that
// yellow + blue really makes green, red + blue makes purple, etc.
const RYB_CUBE = [[255, 255, 255], [255, 40, 110], [255, 216, 60], [255, 128, 40], [52, 150, 255], [148, 70, 225], [60, 196, 110], [90, 70, 80]];
function rybToHex(r, y, b) {
  const c = RYB_CUBE, out = [0, 0, 0];
  for (let i = 0; i < 3; i++) {
    const x0 = lerp(c[0][i], c[1][i], r), x1 = lerp(c[2][i], c[3][i], r);
    const x2 = lerp(c[4][i], c[5][i], r), x3 = lerp(c[6][i], c[7][i], r);
    out[i] = lerp(lerp(x0, x1, y), lerp(x2, x3, y), b);
  }
  return rgbToHex(out);
}
const PAINTS = { r: { name: 'pink', hex: '#ff4f9a' }, y: { name: 'yellow', hex: '#ffd23f' }, b: { name: 'blue', hex: '#3d9bff' } };
function mixPortions(portions) {
  if (!portions.length) return null;
  let r = 0, y = 0, b = 0; portions.forEach(p => { if (p === 'r') r++; if (p === 'y') y++; if (p === 'b') b++; });
  const m = Math.max(r, y, b); // normalise so one colour alone stays fully saturated
  return rybToHex(r / m, y / m, b / m);
}

// ---------- audio (Web Audio, created only after a user gesture) ----------
const Sound = {
  on: true, ac: null, noiseBuf: null,
  ensure() {
    if (!this.on) return null;
    try {
      this.ac = this.ac || new (window.AudioContext || window.webkitAudioContext)();
      if (this.ac.state === 'suspended') this.ac.resume();
      if (!this.noiseBuf) {
        const len = this.ac.sampleRate * .6, buf = this.ac.createBuffer(1, len, this.ac.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        this.noiseBuf = buf;
      }
      return this.ac;
    } catch (e) { return null; }
  },
  tone(freq = 560, dur = .1, type = 'sine', vol = .06, slide = .67, delay = 0) {
    const ac = this.ensure(); if (!ac) return;
    try {
      const t0 = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t0);
      o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t0 + dur);
      g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + dur + .03);
    } catch (e) { }
  },
  noise(dur = .3, f1 = 600, f2 = 2400, vol = .05, delay = 0) {
    const ac = this.ensure(); if (!ac) return;
    try {
      const t0 = ac.currentTime + delay, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = this.noiseBuf; f.type = 'bandpass'; f.Q.value = 2.5;
      f.frequency.setValueAtTime(f1, t0); f.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
      g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + dur * .2);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t0); s.stop(t0 + dur + .05);
    } catch (e) { }
  },
  jump(n) { this.tone(n === 1 ? 330 : 495, .16, 'triangle', .06, 1.8); },
  land() { this.tone(150, .09, 'sine', .07, .6); },
  boing() { this.tone(180, .32, 'sine', .08, 3.2); this.tone(360, .2, 'triangle', .03, 2.2, .03); },
  pop() { this.tone(1100 + Math.random() * 300, .06, 'triangle', .06, .35); },
  pour() { this.noise(.45, 300, 900, .05); this.tone(260, .25, 'sine', .03, .7, .05); },
  whoosh() { this.noise(.5, 400, 3000, .06); },
  click() { this.tone(720, .05, 'square', .025, .9); },
  // soft bell: fundamental + a quiet bright overtone, gentle decay (xylophone / music-box feel)
  bell(freq, vol = .05, delay = 0) { this.tone(freq, .9, 'sine', vol, 1, delay); this.tone(freq * 2.01, .35, 'triangle', vol * .35, 1, delay); this.tone(freq * 3.99, .15, 'sine', vol * .12, 1, delay); },
  chime() { [0, 2, 4, 7].forEach((k, i) => this.bell([523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51][k], .045, i * .085)); },
  twinkle() { const P = [784, 880, 1047, 1175, 1319]; this.bell(P[Math.floor(Math.random() * P.length)], .03); },
  giggle() { [0, 1, 2, 3].forEach(i => this.tone(700 + i * 90 + Math.random() * 40, .07, 'sine', .05, 1.25, i * .075)); },
  hum(on) { this.tone(on ? 110 : 220, .5, 'sawtooth', .025, on ? 2.2 : .5); },
};

// ---------- particles ----------
const particles = [];
const PCOLORS = ['#fff', '#ffc84b', '#ff6ec2', '#59dff1', '#a587ff'];
function burst(x, y, n = 18, colors = PCOLORS, kind = 'star', spread = 1) {
  for (let i = 0; i < n; i++) {
    if (particles.length > 420) particles.shift();
    particles.push({ x, y, vx: rand(-190, 190) * spread, vy: rand(-260, -60) * spread, life: rand(.45, 1), max: 1, c: colors[i % colors.length], r: rand(3, 8), kind, g: kind === 'drop' ? 900 : 500, rot: rand(0, TAU) });
  }
}
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life / .6, 0, 1);
    if (p.kind === 'heart') { ctx.beginPath(); heartPath(p.x, p.y, p.r * 1.3); ctx.fillStyle = p.c; ctx.fill(); }
    else if (p.kind === 'drop' || p.kind === 'dot') ellipse(p.x, p.y, p.r * .8, p.r, p.c);
    else if (p.kind === 'conf') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot * 2); ctx.fillStyle = p.c; ctx.fillRect(-p.r, -p.r * .45, p.r * 2, p.r * .9); ctx.restore(); }
    else star(p.x, p.y, p.r, p.c, 4, p.rot);
  }
  ctx.globalAlpha = 1;
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.rot += dt * 3;
    if (p.kind === 'conf') { p.vx *= Math.exp(-dt * 1.5); p.vy = Math.min(p.vy, 160); }
    if (p.life < 0) particles.splice(i, 1);
  }
}

// ---- 10_creatures.js ----
// ===================================================================
// 10_creatures.js — Pip, Zuzu and Jelly: one coherent rig each.
//   * every limb/ear/wing/tentacle is anchored to a point on the body
//   * secondary motion uses damped springs (ears lag, tails swish)
//   * poses: idle, run, jump (rise), fall, land squash, ride/sit, tap reaction
// ===================================================================
const CHAR_SCALE = 1.18; // creatures are drawn bigger for a close-up feel
const CREATURES = {
  pip: { name: 'Pip', title: 'Pip the rainbow fluff-bun!', cadence: 13, jump: [680, 600] },
  zuzu: { name: 'Zuzu', title: 'Zuzu the twinkly star sprite!', cadence: 10, jump: [690, 620] },
  jelly: { name: 'Jelly', title: 'Jelly the wobbly jelly blob!', cadence: 8.5, jump: [700, 640] },
};

function makeAnim() {
  return {
    t: 0, phase: 0, run: 0, vx: 0, vy: 0, grounded: true, seated: false, facing: 1,
    squash: { x: 1, v: 0 }, lean: { x: 0, v: 0 }, ear: { x: 0, v: 0 }, tail: { x: 0, v: 0 }, look: { x: 0, v: 0 },
    blink: 0, nextBlink: 2.2, react: 0, happy: 0, land: 0, flip: 0, flipDir: 1, hop: 0,
    trail: [], soft: null, wx: 0, wy: 0,
  };
}

// Called every frame with the physical state; produces the pose.
function updateAnim(A, kind, dt, st) {
  const prevGrounded = A.grounded, prevVy = A.vy;
  A.t += dt; A.vx = st.vx; A.vy = st.vy; A.grounded = st.grounded; A.seated = !!st.seated; A.facing = st.facing;
  const speed = Math.abs(st.vx);
  A.run = lerp(A.run, A.grounded && !A.seated ? clamp(speed / 310, 0, 1) : 0, 1 - Math.exp(-dt * 10));
  A.phase += dt * CREATURES[kind].cadence * (A.grounded ? clamp(speed / 310, 0, 1.2) : 0);

  // landing impact → squash + dust
  if (!prevGrounded && A.grounded && prevVy > 220 && !A.seated) {
    A.squash.v -= clamp(prevVy, 0, 1100) * (kind === 'jelly' ? .009 : .006);
    A.land = .35;
    if (A.soft) A.soft.pts.forEach(p => { p.vy += prevVy * .25; p.vx += (p.rx > 0 ? 1 : -1) * prevVy * .18; });
    st.onLand && st.onLand(prevVy);
  }
  A.land = Math.max(0, A.land - dt);
  A.react = Math.max(0, A.react - dt);
  A.happy = Math.max(0, A.happy - dt);
  if (A.flip > 0) A.flip = Math.max(0, A.flip - dt / (kind === 'pip' ? .5 : .6));

  // Squash/stretch target: stretch when rising, slight stretch falling, settle on ground.
  let sq = 1;
  if (!A.grounded && !A.seated) sq = 1 + clamp(-st.vy / 4200, -.06, .14);
  if (kind === 'jelly' && A.grounded) {
    A.hop = -Math.abs(Math.sin(A.phase * .5)) * 22 * A.run;
    sq = 1 + (A.hop < -3 ? .07 : -.1) * A.run;
  } else A.hop = 0;
  spring(A.squash, sq, kind === 'jelly' ? 150 : 230, kind === 'jelly' ? 5 : 9, dt);
  A.squash.x = clamp(A.squash.x, .62, 1.4);

  spring(A.lean, A.seated ? 0 : clamp(st.vx / 310, -1.3, 1.3) * .13 * A.facing, 90, 10, dt);
  // Ears/antennae/tail lag behind motion (positive = swept back / floated up)
  const earT = clamp(speed / 310, 0, 1.4) * .55 + (A.grounded ? 0 : clamp(st.vy / 900, -.7, .9) * -.75);
  spring(A.ear, earT, 110, 6.5, dt);
  spring(A.tail, earT * .8 + Math.sin(A.t * (2.5 + A.run * 8)) * .18, 70, 5, dt);
  spring(A.look, A.run * .8 + (A.react > 0 ? Math.sin(A.t * 9) * .5 : 0), 60, 9, dt);

  A.nextBlink -= dt;
  if (A.nextBlink <= 0) { A.blink = .13; A.nextBlink = rand(1.8, 4.5); }
  A.blink = Math.max(0, A.blink - dt);

  // Zuzu comet trail (world space)

// ---------------- JELLY: translucent soft-body blob with tentacle feet ----------------
const JN = 18;
function jellyRest(i) {
  const a = i / JN * TAU - Math.PI / 2, s = Math.sin(a);
  return [Math.cos(a) * 50 * (s > 0 ? 1.04 : 1), -48 + s * (s < 0 ? 60 : 30)];
}
function updateJellySoft(A, dt, st) {
  const sy = A.squash.x, sx = 1 + (1 - sy) * 1.1;
  const rx = st.x, ry = st.y + (A.seated ? 0 : A.hop);
  if (!A.soft || Math.hypot(A.soft.x - rx, A.soft.y - ry) > 220) {
    A.soft = { x: rx, y: ry, pts: [] };
    for (let i = 0; i < JN; i++) { const r = jellyRest(i); A.soft.pts.push({ x: rx + r[0], y: ry + r[1], vx: 0, vy: 0, rx: r[0] }); }
  }
  A.soft.x = rx; A.soft.y = ry;
  const steps = dt > .02 ? 2 : 1, h = dt / steps;
  for (let s = 0; s < steps; s++) for (let i = 0; i < JN; i++) {
    const p = A.soft.pts[i], r = jellyRest(i);
    const wob = Math.sin(A.t * 5 + i * 1.3) * 1.2;
    const tx = rx + r[0] * sx, ty = ry + r[1] * sy + wob;
    p.vx += (tx - p.x) * 240 * h; p.vy += (ty - p.y) * 240 * h;
    // neighbours pull together a little (surface tension)
    const q = A.soft.pts[(i + 1) % JN], o = A.soft.pts[(i + JN - 1) % JN];
    p.vx += ((q.x + o.x) / 2 - p.x) * 18 * h; p.vy += ((q.y + o.y) / 2 - p.y) * 18 * h;
    p.vx *= Math.exp(-7 * h); p.vy *= Math.exp(-7 * h);
    p.x += p.vx * h; p.y += p.vy * h;
    // cap the lag so fast moves stay squishy without turning into a different shape
    const ex = p.x - tx, ey = p.y - ty, e = Math.hypot(ex, ey), maxLag = 20;
    if (e > maxLag) { p.x = tx + ex / e * maxLag; p.y = ty + ey / e * maxLag; p.vx *= .6; p.vy *= .6; }
    if (p.y > st.y + 2 && A.grounded) { p.y = st.y + 2; p.vy *= -.2; }
  }
}
function drawJelly(A, ox, oy) {
  const S = styleOf('jelly', A);
  const t = A.t, f = A.facing;
  if (!A.soft) updateJellySoft(A, 0, { x: ox, y: oy });
  const P = A.soft.pts.map(p => [(p.x - ox) * f, p.y - oy, p.vx * f, p.vy]);
  let cx = 0, cy = 0; P.forEach(p => { cx += p[0]; cy += p[1]; }); cx /= JN; cy /= JN;
  const OUT = '#5b3fa6';
  // tentacle feet hang from the bottom of the deforming body
  const feet = [7, 8, 9, 10, 11];
  feet.forEach((idx, k) => {
    const p = P[idx], ph = A.phase * .5 + k * 1.3;
    const step = A.run * Math.sin(ph) * 9, lift = A.run * Math.max(0, Math.cos(ph)) * 6;
    const air = !A.grounded && !A.seated;
    const len = air ? 26 : 16 + (A.seated ? 0 : 3);
    const tipX = p[0] + step - p[2] * .05 + Math.sin(t * 6 + k) * (air ? 7 : 2.5), tipY = p[1] + len - lift - p[3] * .02;
    const ctrlX = p[0] + (tipX - p[0]) * .2 + Math.sin(t * 7 + k) * 4, ctrlY = p[1] + len * .6;
    ctx.lineCap = 'round';
    for (const [w, c] of [[13, OUT], [8.5, S.accent === 'rainbow' ? RAINBOW6[k] : (k % 2 ? S.accent : shade(S.body, .2))]]) {
      ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(p[0], p[1] - 6); ctx.quadraticCurveTo(ctrlX, ctrlY, tipX, tipY); ctx.stroke();
    }
    ellipse(tipX, tipY + 1, 5, 5, ['#ff9fe0', '#ffe48a', '#9ff7e0', '#d6a6ff', '#9fd0ff'][k], OUT, 2); ellipse(tipX - 1.5, tipY - .5, 1.8, 1.8, '#ffffff');
  });
  // antennae rooted on the two upper body points
  if (S.antennae) [[1, 1], [JN - 1, -1]].forEach(([idx, side], k) => {
    const p = P[idx], lag = -p[2] * .06, sw = Math.sin(t * 4 + k) * 4;
    const tx = p[0] + side * 16 + lag + sw, ty = p[1] - 34 - p[3] * .04 - A.ear.x * 6;
    ctx.strokeStyle = OUT; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(p[0], p[1] + 4);
    ctx.quadraticCurveTo(p[0] + side * 2, p[1] - 22, tx, ty); ctx.stroke();
    ellipse(tx, ty, 8.5, 8.5, rg(tx, ty, 9, [[0, '#ffffff'], [.4, k ? '#7af0f2' : '#ffd36e'], [1, k ? '#36b9d0' : '#ff9f43']]), OUT, 3);
  });
  // body: smooth closed curve through the soft points
  const bodyPath = () => {
    const m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];

  ctx.lineJoin = 'round'; ctx.beginPath(); bodyPath(); ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 5.5; ctx.stroke();
  // inside the jelly: drifting glitter and a glowing heart core
  ctx.save(); ctx.beginPath(); bodyPath(); ctx.clip();

  for (let i = 0; i < 9; i++) {
    const a = t * (.6 + i * .07) + i * 2.1, r = 14 + (i * 7) % 26;
    sparkle(cx + Math.cos(a) * r, cy + 10 + Math.sin(a) * r * .5, 2.5 + (i % 3), ['#fff', '#fff3a0', '#bff9ff'][i % 3]);
  }

  ctx.globalAlpha = .55; ctx.beginPath(); heartPath(cx + 2, cy + 18, 10 * beat); ctx.fillStyle = '#ff6fb0'; ctx.fill(); ctx.globalAlpha = 1;
  ellipse(cx + 18, cy + 30, 30, 12, 'rgba(90,60,190,.18)');
  // iridescent rim: a rainbow sheen hugging the inside of the edge
  const iri = ctx.createLinearGradient(cx - 60, cy - 60, cx + 60, cy + 40);
  ['#ff9fe0', '#ffe48a', '#9ff7e0', '#9fd0ff', '#d6a6ff'].forEach((c, i) => iri.addColorStop(i / 4, c));
  ctx.globalAlpha = .55 + Math.sin(t * 2) * .1; ctx.strokeStyle = iri; ctx.lineWidth = 9; ctx.beginPath(); bodyPath(); ctx.stroke(); ctx.globalAlpha = 1;
  ctx.restore();
  // frilly bell edge along the bottom of the deforming body
  if (S.frill) for (let i = 6; i <= 12; i++) {
    const a = P[i], b = P[i + 1], mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, r = Math.hypot(b[0] - a[0], b[1] - a[1]) / 2;
    ctx.beginPath(); ctx.arc(mx, my, r + 1, 0, Math.PI); ctx.fillStyle = i % 2 ? 'rgba(255,170,230,.85)' : 'rgba(170,220,255,.85)'; ctx.fill();
    ctx.strokeStyle = OUT; ctx.lineWidth = 2.5; ctx.stroke();
  }
  // glossy highlight follows the top of the body
  const top = P[0], tl = P[JN - 3];

  ctx.moveTo(tl[0] + 10, tl[1] + 8); ctx.quadraticCurveTo(top[0] - 18, top[1] + 4, top[0] - 2, top[1] + 9); ctx.stroke();
  ellipse(tl[0] + 9, tl[1] + 22, 3.5, 3.5, '#ffffffcc');
  // face rides on the body centre
  const fx = cx + 4 + A.look.x * 3, fy = cy - 6;
  drawEye(fx - 15, fy, 12, 15, A, S.eyes, 3, -1);
  drawEye(fx + 16, fy, 12.5, 15.5, A, S.eyes, 3, 1);
  ellipse(fx - 30, fy + 15, 8, 5, '#ff70a8aa'); ellipse(fx + 31, fy + 15, 8, 5, '#ff70a8aa');
  drawMouth(fx + 1, fy + 17, A, '#5a2370');
}

// ---------------- dispatcher ----------------
function creatureShadow(kind, A, drop = 0) {
  // drop = distance down to the floor/platform under the creature: the shadow stays on the ground
  const hover = kind === 'zuzu' ? zuzuHover(A) : 0;
  const k = (kind === 'zuzu' ? .75 - hover / 200 : 1) * clamp(1 - drop / 420, .35, 1);
  ellipse(0, 4 + drop, 44 * k, 9 * k, `rgba(60,25,110,${.22 * clamp(1 - drop / 500, .3, 1)})`);
}
function drawCreature(kind, A, ox, oy, opts = {}) {
  ctx.save(); ctx.translate(ox, oy);
  if (!opts.noShadow) creatureShadow(kind, A, opts.drop || 0);
  if (kind === 'zuzu' && !opts.noTrail) drawZuzuTrail(A, ox, oy);
  const cs = opts.scale ?? CHAR_SCALE;
  ctx.scale(A.facing * cs, cs);
  if (kind === 'pip') drawPip(A);
  else if (kind === 'zuzu') drawZuzu(A);
  else drawJelly(A, ox, oy);
  ctx.restore();
}

// "Realistic" lighting: the creature is drawn into an offscreen layer, then lit from the upper left
// (soft highlight) and shaded underneath (form shadow) using 'source-atop', so it reads as rounded.
const shadeCv = document.createElement('canvas'), shadeCx = shadeCv.getContext('2d');
function drawCreatureLit(kind, A, ox, oy, opts = {}) {
  const m = ctx.getTransform(), tp = (x, y) => [m.a * x + m.c * y + m.e, m.b * x + m.d * y + m.f];
  const pts = [tp(ox - 150, oy - 260), tp(ox + 150, oy - 260), tp(ox - 150, oy + 30), tp(ox + 150, oy + 30)];
  const bx = Math.floor(Math.min(...pts.map(p => p[0]))), by = Math.floor(Math.min(...pts.map(p => p[1])));
  const bw = Math.ceil(Math.max(...pts.map(p => p[0]))) - bx, bh = Math.ceil(Math.max(...pts.map(p => p[1]))) - by;
  if (!(bw > 0 && bh > 0 && bw < 2400 && bh < 2400)) { drawCreature(kind, A, ox, oy, opts); return; }
  if (!opts.noShadow) { ctx.save(); ctx.translate(ox, oy); creatureShadow(kind, A, opts.drop || 0); ctx.restore(); }
  if (shadeCv.width < bw || shadeCv.height < bh) { shadeCv.width = Math.max(shadeCv.width, bw); shadeCv.height = Math.max(shadeCv.height, bh); }
  shadeCx.setTransform(1, 0, 0, 1, 0, 0); shadeCx.globalCompositeOperation = 'source-over'; shadeCx.clearRect(0, 0, bw, bh);
  shadeCx.setTransform(m.a, m.b, m.c, m.d, m.e - bx, m.f - by);
  withCtx(shadeCx, () => drawCreature(kind, A, ox, oy, { ...opts, noShadow: true }));
  shadeCx.setTransform(1, 0, 0, 1, 0, 0); shadeCx.globalCompositeOperation = 'source-atop';
  const lx = bw * .38, ly = bh * .28;
  let g = shadeCx.createRadialGradient(lx, ly, bw * .04, lx, ly, bw * .55);
  g.addColorStop(0, 'rgba(255,252,235,.38)'); g.addColorStop(.5, 'rgba(255,252,235,.1)'); g.addColorStop(1, 'rgba(255,252,235,0)');
  shadeCx.fillStyle = g; shadeCx.fillRect(0, 0, bw, bh);
  g = shadeCx.createLinearGradient(bw * .35, bh * .45, bw * .62, bh * .95);
  g.addColorStop(0, 'rgba(120,30,140,0)'); g.addColorStop(1, 'rgba(120,30,140,.2)');
  shadeCx.fillStyle = g; shadeCx.fillRect(0, 0, bw, bh);
  shadeCx.globalCompositeOperation = 'source-over';
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(shadeCv, 0, 0, bw, bh, bx, by, bw, bh); ctx.restore();
}

// Portraits: the same rig drawn into small canvases (chooser buttons + title screen)
const portraits = [];
function registerPortrait(el, kind, size) {
  const c = el.getContext('2d'), dpr = Math.min(window.devicePixelRatio || 1, 2);
  el.width = size * dpr; el.height = size * dpr;
  const A = makeAnim(); A.t = Math.random() * 5; A.facing = 1;
  const entry = { el, c, kind, size, dpr, A, x: 0 }; portraits.push(entry); return entry;
}
function renderPortraits(dt) {
  for (const p of portraits) {
    if (!p.el.offsetParent) continue; // hidden
    const A = p.A;
    updateAnim(A, p.kind, dt, { vx: 0, vy: 0, grounded: true, facing: 1, x: 0, y: 0 });
    p.c.setTransform(1, 0, 0, 1, 0, 0); p.c.clearRect(0, 0, p.el.width, p.el.height);
    const s = p.size * p.dpr / 175;
    p.c.setTransform(s, 0, 0, s, p.el.width / 2, p.el.height * .97);
    withCtx(p.c, () => drawCreature(p.kind, A, 0, 0, { noTrail: true, scale: 1 }));

}

// ===================================================================
// 40_systems.js — physics, rides and the connected cause→effect chain:
//   paint buckets → mixing bowl → (spin) → pipe → bubble machine tank →
//   colored bubbles drift into the Wonder Engine funnel → battery fills →
//   lever ON → power flows down the cable → Star Launcher wakes, wheel &
//   coaster light up, coaster train wears YOUR mixed color, magnet gets strong.
// ===================================================================
Object.assign(world, { blowT: 0, feedT: 0, feedColor: null, needPaintT: 0, pendingPours: [], lookAhead: 0 });

function discover(id, msg, x, y) {
  if (world.discoveries.has(id)) return false;
  world.discoveries.add(id); updateCounter();
  burst(x ?? player.x, y ?? player.y - 100, 22); Sound.chime();
  if (msg) toast('✨ ' + msg);
  player.anim.happy = 1.4; save(); return true;
}

// ---------------- color mixer ----------------
const COLOR_NAMES = { r: 'Pink', y: 'Yellow', b: 'Blue', ry: 'Orange', by: 'Green', br: 'Purple', bry: 'Muddy Brown' };

function pour(k) {
  if (world.portions.length + world.pendingPours.length >= 4) { world.spinnerWiggle = 1; Sound.click(); return; }
  world.bucketTilt[k] = 1; world.pendingPours.push({ k, t: 0 }); Sound.pour();
}

  if (world.stir > 0) return;
  world.stir = 1; world.mixSpinV = 14; Sound.whoosh();

}

  const color = mixPortions(world.portions); if (!color) return;
  const uniq = [...new Set(world.portions)];
  const formula = uniq.length > 1 ? uniq.map(k => PAINTS[k].name[0].toUpperCase() + PAINTS[k].name.slice(1)).join(' + ') + ' = ' + mixName(world.portions) + '!' : mixName(world.portions) + ' paint!';
  world.portions.forEach((_, i) => world.pipeBlobs.push({ s: -i * .09, color }));
  world.lastMix = color; world.portions = [];
  updatePaintTools();
  toast('🎨 ' + formula);
  discover('mixpaint', null, 2190, 280);
  burst(2190, 280, 18, [color, '#fff', shade(color, .3)], 'drop');
  save();
}
// ---------------- bubbles ----------------
function blow() {

  if (!world.bubbles.some(b => b.ride)) world.bubbles.push({ x: nx - 30, y: ny - 60, r: 64, vx: 20, vy: -30, life: 14, color, hue: rand(180, 320), seed: rand(0, 9), ride: true });

  [0, 1, 2, 3].forEach(i => Sound.tone(500 + i * 120, .09, 'sine', .05, 1.6, i * .06));
  discover('bubbles', colored ? 'Painted bubbles! Watch where they float…' : 'Bubbles! Mix paint to color them!', nx, ny - 40);

function stairEnds(s, H) { return { bot: [s.x0, H.floors[s.f0]], top: [s.x1, H.floors[s.f1]] }; }

// creature on the bottom (or top) step; then the arrow buttons walk along the stairs,
// she can stop or turn round, and stepping off either end puts her on that floor.
function startStairs(s, up) {
  const P = player, H = houseOf(); if (!H || P.ride || P.stair) return;
  const { bot, top } = stairEnds(s, H), from = up ? bot : top;
  if (Math.abs(P.y - from[1]) > 4 || !P.grounded) { burst(from[0], from[1] - 40, 6); Sound.click(); return; }
  P.stair = { s, k: up ? 0 : 1, step: -1, len: Math.hypot(top[0] - bot[0], top[1] - bot[1]) }; P.vy = 0; P.vx = 0;
  P.x = from[0]; P.y = from[1];
  burst(P.x, P.y - 20, 8, ['#fff', '#ffe36e']); Sound.tone(up ? 520 : 440, .15, 'triangle', .04, 1.2);
  discover(up ? 'stairs-up' : 'stairs-down', up ? 'Walk up the stairs with the arrow buttons!' : 'Walk down the stairs with the arrow buttons!', from[0], from[1] - 200);

function updateStairs(dt) {
  const P = player, S = P.stair, H = houseOf(); if (!H) { P.stair = null; return; }
  const { bot, top } = stairEnds(S.s, H), upDir = Math.sign(top[0] - bot[0]);
  const h = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (h) P.facing = h;
  S.k += h * upDir * 250 / S.len * dt;
  if (S.k < 0 || S.k > 1) { // stepped off an end: back to normal walking on that floor
    const end = S.k > 1 ? top : bot; P.stair = null; P.x = end[0] + h * 4; P.y = end[1]; P.vx = h * 250; P.vy = 0; P.grounded = true; P.jumps = 0;
    burst(end[0], end[1], 5, ['#fff', '#ffe36e']); return;
  }
  P.x = lerp(bot[0], top[0], S.k); P.y = lerp(bot[1], top[1], S.k); P.vx = h * 250;
  const n = Math.round(S.k * 14); // musical steps: up the scale going up, down the scale going down
  if (n !== S.step) { if (S.step >= 0) Sound.bell(NOTES[n % 8] * (n >= 8 ? 2 : 1), .025); S.step = n; }
  P.grounded = true; P.vy = 0; P.jumps = 0;
}

function houseDoors() {
  const P = player, list = [];
  for (const id of Object.keys(HOUSES)) {
    const H = HOUSES[id], lk = 'in:' + id;
    list.push({ x: H.exit, y: GROUND, lk, go: () => toggleDoor(id), out: true });
    for (const s of H.stairs) {
      const { bot, top } = stairEnds(s, H);
      list.push({ x: bot[0], y: bot[1], lk, go: () => startStairs(s, true), icon: 'up' });

}

  world.bubbles.forEach(b => { if (b.ride && cull(b.x, 80)) drawBubble(b); });

  drawPitHelpers(t);
  drawParticles();
  if (started) drawHintHand(t);

  if (world.doorFlash > 0) { world.doorFlash -= 1 / 60; ctx.fillStyle = `rgba(255,250,235,${world.doorFlash * 1.6})`; ctx.fillRect(0, 0, vw, VH); } // door transition flash

function paintDropIcon(x, y) {

  ctx.beginPath(); ctx.moveTo(x + 10, y - 6); ctx.lineTo(x + 18, y); ctx.lineTo(x + 10, y + 6); ctx.strokeStyle = '#8452b0'; ctx.lineWidth = 3; ctx.stroke();

}
function update(dt, t) {
  if (toastTimer > 0) { toastTimer -= dt; if (toastTimer <= 0) $('toast').classList.remove('shown'); }
  const nearWall = started && (player.under && player.x > 1760 && player.x < 2232 || PAINT_SURFACES.some(R => camera + vw > R.x1 + Math.min(120, (R.x2 - R.x1) / 2) && camera < R.x2 - Math.min(120, (R.x2 - R.x1) / 2)));

let lastSave = 0, portraitClock = 0;

  const t = ms / 1000;
  if (!lastFrame) lastFrame = t;
  const raw = t - lastFrame, dt = clamp(raw, 0, 1 / 30); lastFrame = t;
  if (started && !paused && raw > 0 && raw < .25) adaptQuality(raw);
  if (!paused) {

    update(dt, gameTime); render(gameTime);
    portraitClock += dt; if (portraitClock > 1 / 20) { renderPortraits(portraitClock); portraitClock = 0; }
  }

}

// ---------------- boot ----------------
if (!CanvasRenderingContext2D.prototype.roundRect) { // older Safari fallback
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) { r = Math.min(typeof r === 'number' ? r : 8, Math.abs(w) / 2, Math.abs(h) / 2); this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r); this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath(); };
}
const restoreInfo = restore();
addEventListener('resize', resize); resize();
camera = clamp(player.x - vw * .4, 0, Math.max(0, WORLD_W - vw));
document.querySelectorAll('.creatureChoice canvas').forEach(c => registerPortrait(c, c.parentElement.dataset.creature, 46));
document.querySelectorAll('.introPick canvas').forEach(c => registerPortrait(c, c.parentElement.dataset.creature, 96));
initInput();
selectCreature(player.creature, true);
document.querySelectorAll('.introPick').forEach(z => z.classList.toggle('chosen', z.dataset.creature === player.creature));
setSound(Sound.on, true); updateCounter(); updatePaintTools(); updateBits(); rebuildBlockPlatforms();
if (restoreInfo.restored) $('playBtn').textContent = '▶ KEEP PLAYING!';
requestAnimationFrame(loop);

// Test/debug hook (used by the automated smoke tests; harmless for players)
window.__DDW = {
  player, world, balls, LAYOUT, keys, Sound, SECRET_STARS, get camera() { return camera; }, get vw() { return vw; }, VH,
  toScreen(x, y) { const r = canvas.getBoundingClientRect(); return { x: (x - camera) / VH * r.height + r.left, y: (y - camY) / VH * r.height + r.top }; },
  houses: HOUSES, HS, enterHouse, houseLevel: () => player.inside ? houseLevel() : -1,
  teleport(x, y = GROUND) { player.ride = null; player.stair = null; player.under = false; player.inside = null; player.x = x; player.y = y; player.vx = player.vy = 0; camera = clamp(x - vw / 2, 0, WORLD_W - vw); },
  get quality() { return quality; }, npcs: NPCS, style: STYLE, blockPlatforms: () => builtPlatforms.length, train: TRAIN, restoreInfo, activate: (x, y) => activate({ x, y }),

})();
