name: Sync the 3D overhaul

# The overhaul is developed and verified in dawsons-world-test. This repository keeps the
# original history, so the feature branch is filled here on the runner from the verified build,
# then the one game file is rebuilt exactly as the normal build workflow does.

on:
  workflow_dispatch:
  push:
    branches:
      - feature/full-3d-overhaul
    paths:
      - '.github/workflows/sync-overhaul.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip sync]')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-3d-overhaul
          fetch-depth: 0
      - name: Copy the verified overhaul from the test repository
        run: |
          set -euo pipefail
          git config user.name "Wonderverse maintenance"
          git config user.email "actions@users.noreply.github.com"
          git remote add verified https://github.com/smullinsok042900/dawsons-world-test.git
          git fetch --depth=1 verified main
          git checkout verified/main -- \
            PROGRESS.md \
            discovery-world/3d/src \
            discovery-world/3d/tests \
            discovery-world/3d/tools \
            discovery-world/3d/package.json \
            discovery-world/3d/package-lock.json \
            discovery-world/3d/docs/GRAPHICS_OVERHAUL_PROGRESS.md
          git status --short
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: discovery-world/3d/package-lock.json
      - name: Install and run the focused tests
        working-directory: discovery-world/3d
        run: |
          npm ci
          node tests/scene-audit.test.mjs
          node tests/spatial.test.mjs
      - name: Rebuild the one game file
        working-directory: discovery-world/3d
        run: node build.mjs
      - name: Commit the verified overhaul [skip sync]
        run: |
          set -euo pipefail
          git add PROGRESS.md discovery-world/3d
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Sync the 3D graphics overhaul from the verified build [skip sync]"
          git push origin HEAD:feature/full-3d-overhaul
